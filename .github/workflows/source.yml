name: Direct source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: git diff --check && test -f app/build.gradle.kts && test ! -d tools/patches
      - name: Report direct-build gate
        run: python3 -c 'import json,re; x=json.load(open("build-inputs/native-publication.json")); assert x.get("status") in ("BLOCKED","ACCEPTED"); a=x.get("acceptance",{}); assert x["status"] != "ACCEPTED" or (set(a)=={"artifact_id","evidence_sha256","journal_sha256","native_manifest_sha256","operation_inventory_sha256","input_approval_sha256","input_asset_id","input_bundle_sha256","dispatch_binding_sha256","plan_sha256","policy_revision","run_attempt","run_id","workflow_metadata_sha256"} and re.fullmatch("[0-9a-f]{40}",a["policy_revision"]) and all(re.fullmatch("[0-9a-f]{64}",a[k]) for k in ("evidence_sha256","journal_sha256","native_manifest_sha256","operation_inventory_sha256","input_approval_sha256","input_bundle_sha256","dispatch_binding_sha256","plan_sha256","workflow_metadata_sha256")) and type(a["run_id"]) is int and type(a["run_attempt"]) is int and type(a["artifact_id"]) is int and type(a["input_asset_id"]) is int); print("Direct Android build gate state:",x["status"])'
