name: Java and Kotlin CodeQL coverage
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 0'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: codeql-application
  cancel-in-progress: true
jobs:
  analyze:
    if: github.repository == '0cwa/collieim-android' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/_codeql-android.yml
    with:
      source_commit: ${{ github.sha }}
      config_commit: ${{ github.sha }}
