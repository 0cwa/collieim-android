name: Project log
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
permissions:
  contents: read
jobs:
  entry:
    name: Project log entry
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: App changes come with a log line or the "no log entry" label
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          NO_ENTRY: ${{ contains(github.event.pull_request.labels.*.name, 'no log entry') }}
        run: |
          changed=$(git diff --name-only "$BASE...HEAD")
          app=$(grep -E '^(app|feature|lib)/' <<<"$changed" | grep -vE '/src/(test|androidTest|testShared)/|/collie-log/' || true)
          log=$(grep -E '^(app/src/main/assets/collie-log/releases/(stable|beta)/|tooling/collie-log/unreleased/)' <<<"$changed" || true)
          if [ -z "$app" ]; then echo "No app code changed."; exit 0; fi
          if [ -n "$log" ]; then echo "Log entry: $log"; exit 0; fi
          if [ "$NO_ENTRY" = "true" ]; then echo "Labelled 'no log entry'."; exit 0; fi
          echo "::error::This PR changes the app. Add tooling/collie-log/unreleased/<PR number>.txt with one plain sentence people would notice (see docs/PROJECT-LOG.md), or add the 'no log entry' label."
          exit 1
