# Layer trailers are optional on ordinary commits. These names describe the
# work and help group related commits. Verified upstream merges require
# `Layer: upgrade` or another layer of kind "upstream".
#
# kind = "feature"   behavior that ships in the app
# kind = "infra"     CI, tooling, docs, website, tests and release machinery
# kind = "upstream"  Signal or Molly ports and their pinned inputs
# alias_of = "name"  an old spelling that points to the preferred name
#
# Tests for a feature go in that feature's layer. `testing` is for shared test
# infrastructure only.

