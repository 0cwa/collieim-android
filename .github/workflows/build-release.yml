name: Build unsigned release APK
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.edition == 'beta' && 'Build TrailBlazer Beta' || 'Build unsigned release APK' }}
# Builds a tag with the same script local releases use. Called by promote.yml to verify a
# locally built release, and run by hand when GitHub should make the release build.
# On PRs that change the recipe it builds both editions twice and checks reproducibility.
on:
  pull_request:
    paths:
      - tooling/reproducible-builds/**
      - .github/workflows/build-release.yml
  workflow_dispatch:
    inputs:
      ref:
        description: Exact commit SHA to build
        required: true
      edition:
        description: App edition
        type: choice
        options: [stable, beta]
        default: stable
        required: true
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      edition:
        type: string
        required: false
        default: stable
permissions:
  contents: read
jobs:
  build:
    name: Build ${{ matrix.edition == 'beta' && 'beta ' || '' }}${{ inputs.ref || github.event.pull_request.head.sha }} (${{ matrix.index }})
    runs-on: ubuntu-24.04
    env:
      COLLIE_BUILD_EDITION: ${{ matrix.edition }}
    strategy:
      matrix:
        edition: ${{ github.event_name == 'pull_request' && fromJSON('["stable", "beta"]') || fromJSON(format('["{0}"]', inputs.edition || 'stable')) }}
        index: ${{ github.event_name == 'pull_request' && fromJSON('[0, 1]') || fromJSON('[0]') }}
    steps:
      - name: Verify Beta dispatch identity
        if: ${{ matrix.edition == 'beta' && github.event_name != 'pull_request' }}
        env:
          REQUESTED_REF: ${{ inputs.ref }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
          JOB_WORKFLOW_REF: ${{ job.workflow_ref }}
        run: |
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$REPOSITORY" = 0cwa/collieim-android
          test "$CALLER_WORKFLOW_REF" = "$JOB_WORKFLOW_REF"
          test "$DISPATCH_REF" = refs/heads/main
          test "$REQUESTED_REF" = "$DISPATCH_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify checked-out Beta source
        if: ${{ matrix.edition == 'beta' && github.event_name != 'pull_request' }}
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: ./.github/actions/disk-cleanup
      - name: Build the candidate
        run: tooling/reproducible-builds/build-release.sh "$RUNNER_TEMP/out"
      - name: Prepare Beta artifact identity
        if: ${{ matrix.edition == 'beta' }}
        shell: bash
        run: |
          shopt -s nullglob
          apks=("$RUNNER_TEMP"/out/*.apk)
          test "${#apks[@]}" = 1
          mv -- "${apks[0]}" "$RUNNER_TEMP/out/trailblazer-beta.apk"
          git rev-parse HEAD > "$RUNNER_TEMP/out/source-commit.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/out/source-tree.txt"
          (cd "$RUNNER_TEMP/out" && sha256sum trailblazer-beta.apk > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-release-apk${{ github.event_name == 'pull_request' && format('-{0}', matrix.edition) || '' }}${{ matrix.index != 0 && format('-{0}', matrix.index) || '' }}
          path: ${{ runner.temp }}/out/
          retention-days: 14
          if-no-files-found: error

  determinism:
    name: Both ${{ matrix.edition }} builds are identical
    if: github.event_name == 'pull_request'
    needs: build
    strategy:
      matrix:
        edition: [stable, beta]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: unsigned-release-apk-${{ matrix.edition }}*
          path: ${{ runner.temp }}/apks
      - run: |
          sha256sum "$RUNNER_TEMP"/apks/*/*.apk
          python3 tooling/reproducible-builds/apkdiff/apkdiff.py \
            "$RUNNER_TEMP"/apks/unsigned-release-apk-${{ matrix.edition }}/*.apk \
            "$RUNNER_TEMP"/apks/unsigned-release-apk-${{ matrix.edition }}-1/*.apk
