name: Gradle cache replay trial
on:
  push:
    branches: [gradle-cache-replay-trial]
permissions:
  contents: read
  actions: read
cache-mode: read

env:
  GRADLE_USER_HOME: /home/runner/.gradle
  ARCHIVE_LIMIT: '2173121088'
  SOURCE_SHA: 0d4b08c0de99d4281f768319d7a77793d193dfb5
  SOURCE_RUN: '46072953396'
  SOURCE_ARTIFACT: '15234369481'

jobs:
  seed:
    if: github.event_name == 'push' && github.repository == '0cwa/collieim-android' && github.ref == 'refs/heads/gradle-cache-replay-trial'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      archive-sha: ${{ steps.archive.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 4
      - name: Verify that the workload source matches the seed
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$SOURCE_SHA" HEAD
          git diff --exit-code "$SOURCE_SHA" HEAD -- . \
            ':!.github/workflows/gradle-cache-replay-trial.yml' \
            ':!.github/actions/gradle-cache-trial-reference/action.yml' \
            ':!.github/scripts/gradle-cache-trial.sh'
          printf 'Workload source matches %s at trial head %s\n' "$SOURCE_SHA" "$GITHUB_SHA"
      - uses: ./.github/actions/disk-cleanup
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - name: Match the seed runner image, JDK and SDK layout
        shell: bash
        run: |
          set -euo pipefail
          test "${ImageOS:?}/${ImageVersion:?}" = ubuntu24/20261122.23.1
          test "$JAVA_HOME" = /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/21.0.13-2/x64
          test "$ANDROID_HOME" = /usr/local/lib/android/sdk
      - name: Verify the original seed and artifact identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="repos/$GITHUB_REPOSITORY"
          gh api "$repo/actions/jobs/140753970062" |
            jq -e --argjson run "$SOURCE_RUN" --arg sha "$SOURCE_SHA" '
              .run_id == $run and .head_sha == $sha and .name == "seed" and .conclusion == "success"
            ' > /dev/null
          gh api "$repo/actions/artifacts/$SOURCE_ARTIFACT" |
            jq -e --argjson artifact "$SOURCE_ARTIFACT" --argjson run "$SOURCE_RUN" --arg sha "$SOURCE_SHA" '
              .id == $artifact and .expired == false and .size_in_bytes == 1723218748 and
              .digest == "sha256:7b805fd6578aba44352ee8de2b5db0ba287dbae6700f594a8f2d22c182b6ceb2" and
              .workflow_run.id == $run and .workflow_run.head_sha == $sha and
              .workflow_run.head_branch == "gradle-cache-replay-trial"
            ' > /dev/null
      - name: Download the original seed artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ env.SOURCE_ARTIFACT }}
          run-id: ${{ env.SOURCE_RUN }}
          repository: 0cwa/collieim-android
          github-token: ${{ github.token }}
          digest-mismatch: error
          path: ${{ runner.temp }}/gradle-trial
      - name: Verify and unpack the known app-0 seed
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          archive="$RUNNER_TEMP/gradle-trial/gradle-cache.tar.zst"
          test "$(stat -c %s "$archive")" -eq 1723218594
          printf '%s  %s\n' 'e3675140183589998791096742d6af4ba6c90c5c4c408faaca2ba54f36e90f84' "$archive" |
            sha256sum --check
          test -z "${GRADLE_RO_DEP_CACHE:-}"
          if [[ -e "$GRADLE_USER_HOME" ]]; then
            mv "$GRADLE_USER_HOME" "$RUNNER_TEMP/image-gradle-home"
          fi
          mkdir "$GRADLE_USER_HOME"
          tar --zstd -xf "$archive" -C "$GRADLE_USER_HOME" caches/modules-2 caches/9.6.0/transforms
          printf 'Reused source run %s artifact %s\n' "$SOURCE_RUN" "$SOURCE_ARTIFACT" >> "$GITHUB_STEP_SUMMARY"
      - uses: ./.github/actions/gradle-cache-trial-reference
        with:
          workload: modules
          fixtures-only: 'true'
      - name: Bootstrap the checksum-pinned Gradle distribution
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --version | tee "$RUNNER_TEMP/gradle-version.txt"
          grep -Fx 'Gradle 9.6.0' "$RUNNER_TEMP/gradle-version.txt"
      - name: Warm modules in the shared Gradle home
        id: modules
        continue-on-error: true
        run: bash .github/scripts/gradle-cache-trial.sh modules seed
      - name: Warm Stable APKs in the shared Gradle home
        id: stable
        continue-on-error: true
        run: bash .github/scripts/gradle-cache-trial.sh stable seed
      - name: Warm Beta APKs in the shared Gradle home
        id: beta
        continue-on-error: true
        run: bash .github/scripts/gradle-cache-trial.sh beta seed
      - name: Measure the complete expanded archive
        id: archive
        shell: bash
        env:
          MODULES_OUTCOME: ${{ steps.modules.outcome }}
          STABLE_OUTCOME: ${{ steps.stable.outcome }}
          BETA_OUTCOME: ${{ steps.beta.outcome }}
        run: |
          set -euo pipefail
          printf 'Seed phases: modules=%s Stable=%s Beta=%s\n' "$MODULES_OUTCOME" "$STABLE_OUTCOME" "$BETA_OUTCOME" |
            tee -a "$GITHUB_STEP_SUMMARY"
          test "$MODULES_OUTCOME/$STABLE_OUTCOME/$BETA_OUTCOME" = 'success/success/success'
          mkdir -p "$RUNNER_TEMP/expanded-trial"
          archive="$RUNNER_TEMP/expanded-trial/gradle-cache.tar.zst"
          tar --zstd --exclude='*.lock' --exclude=gc.properties -cf "$archive" \
            -C "$GRADLE_USER_HOME" caches/modules-2 caches/9.6.0/transforms
          size=$(stat -c %s "$archive")
          printf 'Expanded archive: %s bytes (limit %s)\n' "$size" "$ARCHIVE_LIMIT" | tee -a "$GITHUB_STEP_SUMMARY"
          if (( size > ARCHIVE_LIMIT )); then
            echo '::error::Expanded archive exceeds the two-generation cache budget'
            exit 1
          fi
          sha=$(sha256sum "$archive" | cut -d' ' -f1)
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          printf 'Expanded archive SHA-256: %s\n' "$sha" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the expanded candidate
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gradle-cache-expanded-${{ github.run_attempt }}
          path: ${{ runner.temp }}/expanded-trial/gradle-cache.tar.zst
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  replay:
    name: Replay Gradle cache (${{ matrix.workload }})
    needs: seed
    if: github.event_name == 'push' && github.repository == '0cwa/collieim-android' && github.ref == 'refs/heads/gradle-cache-replay-trial'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        workload: [app-0, app-1, modules, stable, beta]
    env:
      WORKLOAD: ${{ matrix.workload }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 4
      - name: Verify that the workload source matches the seed
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$SOURCE_SHA" HEAD
          git diff --exit-code "$SOURCE_SHA" HEAD -- . \
            ':!.github/workflows/gradle-cache-replay-trial.yml' \
            ':!.github/actions/gradle-cache-trial-reference/action.yml' \
            ':!.github/scripts/gradle-cache-trial.sh'
          printf 'Workload source matches %s at trial head %s\n' "$SOURCE_SHA" "$GITHUB_SHA"
      - uses: ./.github/actions/disk-cleanup
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - name: Match the seed runner image, JDK and SDK layout
        shell: bash
        run: |
          set -euo pipefail
          test "${ImageOS:?}/${ImageVersion:?}" = ubuntu24/20261122.23.1
          test "$JAVA_HOME" = /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/21.0.13-2/x64
          test "$ANDROID_HOME" = /usr/local/lib/android/sdk
      - uses: ./.github/actions/gradle-cache-trial-reference
        with:
          workload: ${{ matrix.workload }}
      - name: Bootstrap the checksum-pinned Gradle distribution
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --version | tee "$RUNNER_TEMP/gradle-version.txt"
          grep -Fx 'Gradle 9.6.0' "$RUNNER_TEMP/gradle-version.txt"
      - name: Run the warm reference in normal CI mode
        id: baseline
        continue-on-error: true
        run: bash .github/scripts/gradle-cache-trial.sh "$WORKLOAD" baseline
      - name: Start the candidate with fresh Gradle and project state
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(pwd -P)" = "$GITHUB_WORKSPACE"
          git diff --quiet HEAD
          if [[ -d build/host-tests ]]; then
            mv build/host-tests "$RUNNER_TEMP/host-tests"
          fi
          # Drop the baseline's generated files on this disposable runner.
          git clean -ffdx
          if [[ -d "$RUNNER_TEMP/host-tests" ]]; then
            mkdir -p build
            mv "$RUNNER_TEMP/host-tests" build/host-tests
          fi
          mv "$GRADLE_USER_HOME" "$RUNNER_TEMP/baseline-gradle-home"
          mkdir "$GRADLE_USER_HOME"
          mv "$RUNNER_TEMP/baseline-gradle-home/wrapper" "$GRADLE_USER_HOME/wrapper"
          # Free the disposable baseline files before extracting the candidate.
          rm -rf -- "$RUNNER_TEMP/baseline-gradle-home"
      - name: Download the exact expanded candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.seed.outputs.artifact-id }}
          digest-mismatch: error
          path: ${{ runner.temp }}/gradle-trial
      - name: Verify and extract the candidate
        env:
          ARCHIVE_SHA: ${{ needs.seed.outputs.archive-sha }}
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gradle-trial/gradle-cache.tar.zst"
          test "$(stat -c %s "$archive")" -le "$ARCHIVE_LIMIT"
          printf '%s  %s\n' "$ARCHIVE_SHA" "$archive" | sha256sum --check
          test ! -e "$GRADLE_USER_HOME/caches"
          test -z "${GRADLE_RO_DEP_CACHE:-}"
          tar --zstd -xf "$archive" -C "$GRADLE_USER_HOME" caches/modules-2 caches/9.6.0/transforms
          printf 'Candidate SHA-256: %s\n' "$ARCHIVE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Replay the candidate offline without another Gradle cache
        run: bash .github/scripts/gradle-cache-trial.sh "$WORKLOAD" candidate
      - name: Check for transform rebuilds added by the candidate
        env:
          BASELINE_OUTCOME: ${{ steps.baseline.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$BASELINE_OUTCOME" != success ]]; then
            echo '::error::Reference replay failed; no valid transform baseline'
            exit 1
          fi
          export LC_ALL=C
          cd "$RUNNER_TEMP/gradle-trial"
          comm -23 "$WORKLOAD-candidate-rebuilt.txt" "$WORKLOAD-baseline-rebuilt.txt" > candidate-extra-rebuilds.txt
          if [[ -s candidate-extra-rebuilds.txt ]]; then
            echo '::error::The candidate rebuilt additional transforms'
            cat candidate-extra-rebuilds.txt
            exit 1
          fi
