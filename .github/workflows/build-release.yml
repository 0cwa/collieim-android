name: Build unsigned release APK
# Builds a tag with the same script local releases use. Called by promote.yml to verify a
# locally built release, and run by hand when GitHub should make the release build.
# On PRs that change the recipe it builds twice and checks that both builds are identical.
on:
  pull_request:
    paths:
      - tooling/reproducible-builds/**
      - .github/workflows/build-release.yml
  workflow_dispatch:
    inputs:
      ref:
        description: Tag or commit to build
        required: true
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
permissions:
  contents: read
jobs:
  build:
    name: Build ${{ inputs.ref || github.event.pull_request.head.sha }} (${{ matrix.index }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        index: ${{ github.event_name == 'pull_request' && fromJSON('[0, 1]') || fromJSON('[0]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: ./.github/actions/disk-cleanup
      - run: tooling/reproducible-builds/build-release.sh "$RUNNER_TEMP/out"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-release-apk${{ matrix.index != 0 && format('-{0}', matrix.index) || '' }}
          path: ${{ runner.temp }}/out/*.apk
          retention-days: 14
          if-no-files-found: error

  determinism:
    name: Both builds are identical
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: unsigned-release-apk*
          path: ${{ runner.temp }}/apks
      - run: |
          sha256sum "$RUNNER_TEMP"/apks/*/*.apk
          python3 tooling/reproducible-builds/apkdiff/apkdiff.py "$RUNNER_TEMP"/apks/unsigned-release-apk/*.apk "$RUNNER_TEMP"/apks/unsigned-release-apk-1/*.apk
