name: PR checks
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Metadata edits still run required checks, but must not cancel the full run.
  group: pr-checks-${{ github.ref }}${{ github.event.action == 'edited' && !github.event.changes.base.ref.from && '-metadata' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    name: Detect build input changes
    if: ${{ github.event_name != 'pull_request' || (!github.event.pull_request.draft && (github.event.action != 'edited' || github.event.changes.base.ref.from)) }}
    runs-on: ubuntu-24.04
    outputs:
      build_changed: ${{ steps.detect.outputs.build_changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Compare the PR merge commit with its base
        id: detect
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
            echo 'build_changed=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Use the base parent of the checked-out merge commit with its depth-2 history.
          # The proguard and r8 pathspecs also match files in shrinker-rule directories.
          changed=$(git diff --no-renames --name-only HEAD^1 HEAD -- \
            gradle/ gradlew gradlew.bat ':(glob)**/*.gradle.kts' ':(glob)**/*.gradle' \
            ':(glob)**/gradle.properties' ':(glob)**/AndroidManifest.xml' \
            ':(glob)**/*.pro' '*proguard*' '*r8*' ':(glob)**/.gitattributes' \
            ':(glob)**/src/*[Bb]eta*/**' \
            buildSrc/ build-logic/ build-inputs/ tooling/reproducible-builds/ \
            'tooling/gradle.properties*' 'app/build.gradle*' .github/actions/ .github/workflows/pr.yml)
          if [[ -n "$changed" ]]; then
            echo 'build_changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'build_changed=false' >> "$GITHUB_OUTPUT"
          fi

  layer-trailers:
    name: Layer trailers
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Every non-merge commit names its feature layer
        env:
          COLLIE_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          BASE="refs/remotes/origin/$GITHUB_BASE_REF"
          git show "$BASE:tooling/git-hooks/collie_check_layer_trailers.py" > "$RUNNER_TEMP/collie_check_layer_trailers.py"
          python3 "$RUNNER_TEMP/collie_check_layer_trailers.py" range "$BASE" HEAD
      - name: Check commit and push hooks against real Git repositories
        if: ${{ hashFiles('tooling/git-hooks/test_*.py') != '' }}
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tooling/git-hooks -p 'test_*.py'

  fastlane-metadata:
    name: Fastlane metadata
    if: github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref.from
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 tooling/fastlane/check_metadata.py

  fast-lint:
    name: Fast lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
      - run: cp tooling/gradle.properties.docker "$HOME/.gradle/gradle.properties"
      - name: Fail only on findings in changed files
        # The codebase carries 24 inherited findings (mostly Molly's core/gms shims); they are
        # reported here but do not block. New findings in files this change touches do.
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          ./gradlew --no-daemon :fast-lint:fastLint || true
          report=tooling/fast-lint/build/reports/fast-lint/findings.txt
          test -f "$report"
          BASE=HEAD^1
          if [ "$GITHUB_EVENT_NAME" = push ] && [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            # Preserve the whole push range, including pushes with multiple commits.
            git cat-file -e "$BEFORE^{commit}" 2>/dev/null || git fetch --depth=1 origin "$BEFORE"
            BASE=$BEFORE
          fi
          grep -E '^  [^ ]+:[0-9]+: ' "$report" > "$RUNNER_TEMP/all.txt" || true
          git diff --name-only "$BASE" HEAD > "$RUNNER_TEMP/changed-paths.txt"
          sed 's/^/  /; s/$/:/' "$RUNNER_TEMP/changed-paths.txt" > "$RUNNER_TEMP/changed.txt"
          grep -F -f "$RUNNER_TEMP/changed.txt" "$RUNNER_TEMP/all.txt" > "$RUNNER_TEMP/new.txt" || true
          echo "Findings: $(wc -l < "$RUNNER_TEMP/all.txt") total, $(wc -l < "$RUNNER_TEMP/new.txt") in changed files"
          if [ -s "$RUNNER_TEMP/new.txt" ]; then cat "$RUNNER_TEMP/new.txt"; exit 1; fi

  unit-test-shards:
    name: Unit tests (${{ matrix.shard }})
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        shard: [app-0, app-1, modules]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/disk-cleanup
      - name: Check host-test tooling
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tooling/host-tests -p 'test_*.py'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.14'
      - name: Install pinned screenshot decoder
        run: |
          python3 -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r tooling/ci/png-requirements.txt
      - name: Check CI result gates
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tooling/ci -p 'test_*.py'
      - name: Record the tested source
        run: |
          mkdir -p build/ci
          git rev-parse HEAD > build/ci/source-commit.txt
          git rev-parse HEAD^{tree} > build/ci/source-tree.txt
      - name: Cache test-only libsignal JNI
        id: host-jni-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            build/host-tests/resources
            build/host-tests/receipt.json
          key: host-libsignal-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build-inputs/native-lock.json', 'build-inputs/engineering.json', 'build-inputs/host-test-inputs.json', 'tooling/host-tests/build_libsignal.py') }}
      - name: Build pinned Linux JNI for unit tests
        if: steps.host-jni-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang libclang-dev cmake make protobuf-compiler libprotobuf-dev binutils
          rust_version=$(python3 -c 'import json; print(json.load(open("build-inputs/native-lock.json"))["toolchain_reference"]["rust_version"])')
          rustup toolchain install "$rust_version" --profile minimal
          python3 tooling/host-tests/build_libsignal.py
      - name: Verify test-only libsignal JNI
        run: python3 tooling/host-tests/build_libsignal.py --verify-only
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ matrix.shard == 'app-1' || github.ref != 'refs/heads/main' }}
          cache-cleanup: ${{ matrix.shard == 'app-1' && 'on-success' || 'always' }}
      - run: cp tooling/gradle.properties.docker "$HOME/.gradle/gradle.properties"
      - name: Restore Robolectric android-all jars
        id: robolectric-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-jars-Linux-${{ hashFiles('tooling/ci/robolectric-jars.txt') }}
      - name: Fetch missing Robolectric android-all jars
        timeout-minutes: 20
        run: bash tooling/ci/prefetch-robolectric-jars.sh
      - name: Run unit test shard
        env:
          SHARD: ${{ matrix.shard }}
          JAVA_TOOL_OPTIONS: -Drobolectric.dependency.repo.url=https://maven-central.storage-download.googleapis.com/maven2
        run: |
          if [ "$SHARD" = modules ]; then
            ./gradlew --no-daemon --continue -PcollieHostJniDir=build/host-tests/resources \
              testDebugUnitTest :core:util-jvm:test :lib:libsignal-service:test \
              :core:network:test :lib:network:test :fast-lint:test :lintchecks:test
          else
            ./gradlew --no-daemon --continue -PcollieHostJniDir=build/host-tests/resources \
              -PcollieAppTestShard="${SHARD#app-}" :app:testProdWebsiteDebugUnitTest
          fi
      - name: Save Robolectric android-all jars
        if: ${{ github.ref == 'refs/heads/main' && matrix.shard == 'app-0' && steps.robolectric-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2/repository/org/robolectric
          key: ${{ steps.robolectric-cache.outputs.cache-primary-key }}
      - name: Package shard results
        if: ${{ !cancelled() }}
        run: |
          find app core feature lib tooling \( -path '*/build/test-results/*/TEST-*.xml' -o -path '*/build/reports/tests/*' \) -type f -print0 > "$RUNNER_TEMP/results-list"
          printf '%s\0' build/host-tests/receipt.json build/ci/source-commit.txt build/ci/source-tree.txt >> "$RUNNER_TEMP/results-list"
          tar --null -T "$RUNNER_TEMP/results-list" -cf "$RUNNER_TEMP/results.tar"
      - name: Keep shard results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: ${{ runner.temp }}/results.tar
          if-no-files-found: error

  unit-tests:
    name: Unit tests
    if: ${{ !cancelled() && needs.changes.result != 'skipped' }}
    needs: [changes, unit-test-shards]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: unit-test-shard-*-${{ github.run_id }}
          path: build/shard-artifacts
      - name: Combine and verify all unit test results
        env:
          SHARD_RESULT: ${{ needs.unit-test-shards.result }}
          CI_TEST_POLICY: .github/ci-required-tests.json
        run: |
          for shard in app-0 app-1 modules; do
            mkdir -p "build/shards/$shard"
            tar -xf "build/shard-artifacts/unit-test-shard-$shard-${{ github.run_id }}/results.tar" -C "build/shards/$shard"
            mkdir -p "build/shards/$shard"/{app,core,feature,lib,tooling}
            (cd "build/shards/$shard" && find app core feature lib tooling -path '*/build/test-results/*/TEST-*.xml' -type f -exec cp --parents -t "$GITHUB_WORKSPACE" {} +)
          done
          mkdir -p build/ci
          mkdir -p build/host-tests
          cp build/shards/modules/build/host-tests/receipt.json build/host-tests/receipt.json
          cp "$CI_TEST_POLICY" build/ci/ci-required-tests.json
          git rev-parse HEAD > build/ci/source-commit.txt
          git rev-parse HEAD^{tree} > build/ci/source-tree.txt
          for shard in app-0 app-1 modules; do
            cmp "build/shards/$shard/build/ci/source-commit.txt" build/ci/source-commit.txt
            cmp "build/shards/$shard/build/ci/source-tree.txt" build/ci/source-tree.txt
          done
          python3 .github/scripts/check-unit-test-results.py --policy "$CI_TEST_POLICY" \
            --shard-root build/shards/app-0 --shard-root build/shards/app-1 \
            --shard-root build/shards/modules --json-output build/ci/unit-test-results.json
          test "$SHARD_RESULT" = success
      - name: Keep combined unit test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-reports-${{ github.run_id }}
          path: |
            build/shards
            build/ci
            build/host-tests/receipt.json
            **/build/test-results/**/*.xml
            !build/shards/**/build/test-results/**
          if-no-files-found: error

  production-build:
    name: Unsigned production build
    needs: changes
    if: ${{ needs.changes.outputs.build_changed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/disk-cleanup
      - name: Build the exact candidate with the release recipe
        run: |
          git rev-parse HEAD HEAD^{tree}
          tooling/reproducible-builds/build-release.sh "$RUNNER_TEMP/production-build"
          git rev-parse HEAD > "$RUNNER_TEMP/production-build/source-commit.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/production-build/source-tree.txt"
          sha256sum "$RUNNER_TEMP/production-build"/*.apk > "$RUNNER_TEMP/production-build/SHA256SUMS"
      - name: Retain the unsigned APK and source identity
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-build-${{ github.run_id }}
          path: ${{ runner.temp }}/production-build
          retention-days: 14
          if-no-files-found: error

  beta-compile:
    name: TrailBlazer Beta compile
    needs: changes
    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' && needs.changes.outputs.build_changed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      COLLIE_BUILD_EDITION: beta
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: ./.github/actions/disk-cleanup
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: cp tooling/gradle.properties.docker "$HOME/.gradle/gradle.properties"
      - name: Compile and assemble the Beta variant
        run: ./gradlew --no-daemon :app:assembleProdWebsiteBeta

  security-readiness:
    name: Security readiness
    if: ${{ !cancelled() && needs.changes.result != 'skipped' }}
    needs: [changes, unit-tests, production-build]
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful tests and the expected production build result
        env:
          BUILD_CHANGED: ${{ needs.changes.outputs.build_changed }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          UNIT_TESTS_RESULT: ${{ needs.unit-tests.result }}
          PRODUCTION_BUILD_RESULT: ${{ needs.production-build.result }}
        run: |
          test "$CHANGES_RESULT" = success
          test "$UNIT_TESTS_RESULT" = success
          if [[ "$GITHUB_EVENT_NAME" == pull_request && "$BUILD_CHANGED" == false ]]; then
            test "$PRODUCTION_BUILD_RESULT" = skipped
          else
            test "$BUILD_CHANGED" = true
            test "$PRODUCTION_BUILD_RESULT" = success
          fi
