name: Publish prerelease
# Run after the maintainer pushes a signed tag and uploads collie.apk to a draft.
# This entry point publishes Collie only; TrailBlazer has a separate identity.
on:
  pull_request:
    paths:
      - tooling/release/**
      - .github/workflows/release.yml
      - .github/workflows/promote.yml
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v8.36.3-2
        required: true
      built_on:
        description: Where the release APK was built
        type: choice
        options: [local, github]
        required: true
      verify_only:
        description: Check an existing published release without changing it
        type: boolean
        default: false
      legacy_build_run:
        description: Original build run ID for an older release (verify-only)
        type: string
permissions: {}
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && (inputs.verify_only && format('verify-release-{0}', inputs.tag) || 'release-im.collie.app') || format('release-policy-pr-{0}', github.event.pull_request.number) }}
  cancel-in-progress: false
env:
  TAG: ${{ inputs.tag }}
  SOURCE_BRANCH: main
  BUILT_ON: ${{ inputs.built_on }}
  GH_REPO: ${{ github.repository }}
  GH_HOST: github.com
jobs:
  policy-tests:
    name: Release publication policy
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tooling/release -p 'test_*.py' -v

  publish:
    needs: policy-tests
    if: github.event_name == 'workflow_dispatch' && !inputs.verify_only && github.repository == '0cwa/collieim-android' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the exact trusted workflow and signer policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify the signed source, draft state and APK identity
        id: identity
        run: |
          mkdir -p "$RUNNER_TEMP/release-evidence"
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          python3 tooling/release/publication.py inspect --tag "$TAG" --purpose publish \
            --source-branch "$SOURCE_BRANCH" \
            --scratch "$RUNNER_TEMP/release-assets" --build-tools "$bt" \
            --output "$RUNNER_TEMP/release-evidence/before.json" --github-output "$GITHUB_OUTPUT"
      - name: Exact tag commit passed tests and the production build
        env:
          SOURCE_COMMIT: ${{ steps.identity.outputs.source_commit }}
        run: |
          python3 tooling/ci/verify_release_readiness.py \
            --repository "$GH_REPO" --sha "$SOURCE_COMMIT" \
            --source-branch "$SOURCE_BRANCH" \
            --report "$RUNNER_TEMP/release-evidence/ci.json"
      - name: Record the artifact from the approved production CI attempt
        id: bind-build
        run: |
          python3 tooling/release/apk_evidence.py --ci-report "$RUNNER_TEMP/release-evidence/ci.json" \
            --github-output "$GITHUB_OUTPUT"
      - name: Bind the draft APK to the signed tag and approved unsigned build
        id: draft-proof
        env:
          BOUND_BUILD: ${{ steps.bind-build.outputs.bound_build }}
        run: |
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          digest=$(jq -er '.assets[] | select(.name == "collie.apk") | .sha256' "$RUNNER_TEMP/release-evidence/before.json")
          python3 tooling/release/apk_evidence.py --allow-draft --tag "$TAG" \
            --scratch "$RUNNER_TEMP/verify-draft" --build-tools "$bt" --source-branch "$SOURCE_BRANCH" \
            --bound-build "$BOUND_BUILD" --published-sha256 "$digest" --github-output "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.draft-proof.outputs.build_run_id }}
          artifact-ids: ${{ steps.draft-proof.outputs.artifact_id }}
          path: ${{ runner.temp }}/draft-source-build
      - name: Require a byte-for-byte match before opening the prerelease
        env:
          SOURCE_COMMIT: ${{ steps.draft-proof.outputs.source_commit }}
          DRAFT_APK: ${{ steps.draft-proof.outputs.published_apk }}
        run: |
          cd "$RUNNER_TEMP/draft-source-build"
          test "$(cat source-commit.txt)" = "$SOURCE_COMMIT"
          shopt -s nullglob
          apks=(*.apk)
          test "${#apks[@]}" -eq 1
          result=$(env -u GH_TOKEN bash "$GITHUB_WORKSPACE/tooling/release/verify-apk-match.sh" "${apks[0]}" "$DRAFT_APK")
          printf '%s\n' "$result" > "$RUNNER_TEMP/release-evidence/draft-apk-match.txt"
      - name: Read release notes from the signed tag commit
        env:
          SOURCE_COMMIT: ${{ steps.identity.outputs.source_commit }}
          VERSION: ${{ steps.identity.outputs.version_name }}
        run: |
          notes_path="docs/release-notes/$VERSION.md"
          if ! entry=$(git ls-tree "$SOURCE_COMMIT" -- "$notes_path") ||
             ! read -r mode type blob path <<< "$entry" ||
             [[ "$mode" != 100644 || "$type" != blob || "$path" != "$notes_path" ]] ||
             ! git cat-file blob "$blob" > "$RUNNER_TEMP/notes.md" ||
             [[ ! -s "$RUNNER_TEMP/notes.md" ]]; then
            echo "::error::Signed release commit $SOURCE_COMMIT must contain a nonempty regular file at $notes_path"
            exit 1
          fi
          printf '\n\n[Source-to-APK verification run](%s/%s/actions/runs/%s)\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$RUNNER_TEMP/notes.md"
      - name: Record exact assets and publish a prerelease without changing Latest
        id: publish
        run: |
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          python3 tooling/release/publication.py publish \
            --identity "$RUNNER_TEMP/release-evidence/before.json" --built-on "$BUILT_ON" \
            --source-branch "$SOURCE_BRANCH" --ci-report "$RUNNER_TEMP/release-evidence/ci.json" \
            --notes "$RUNNER_TEMP/notes.md" --scratch "$RUNNER_TEMP/release-assets" --build-tools "$bt" \
            --output "$RUNNER_TEMP/release-evidence/published.json"
          digest=$(jq -er '.identity.assets[] | select(.name == "collie.apk") | .sha256' \
            "$RUNNER_TEMP/release-evidence/published.json")
          echo "published_sha256=$digest" >> "$GITHUB_OUTPUT"
      - name: Retain publication and exact-commit CI evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release-evidence/*.json
            ${{ runner.temp }}/release-evidence/draft-apk-match.txt
          retention-days: 30
          if-no-files-found: warn

  verify:
    name: Verify published APK byte for byte
    needs: policy-tests
    if: >-
      !cancelled() && github.event_name == 'workflow_dispatch' &&
      github.repository == '0cwa/collieim-android' && github.ref == 'refs/heads/main' &&
      inputs.verify_only && needs.policy-tests.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bind the published asset and existing build to the signed tag
        id: proof
        env:
          LEGACY_RUN: ${{ inputs.verify_only && inputs.legacy_build_run || '' }}
        run: |
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          args=(--tag "$TAG" --scratch "$RUNNER_TEMP/verify-release" --build-tools "$bt"
                --github-output "$GITHUB_OUTPUT" --source-branch "$SOURCE_BRANCH")
          if [[ -n "$LEGACY_RUN" ]]; then
            args+=(--legacy-build-run "$LEGACY_RUN")
          fi
          python3 tooling/release/apk_evidence.py "${args[@]}"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.proof.outputs.build_run_id }}
          artifact-ids: ${{ steps.proof.outputs.artifact_id }}
          path: ${{ runner.temp }}/release-source-build
      - name: Reconstruct and compare the exact signed download
        env:
          SOURCE_COMMIT: ${{ steps.proof.outputs.source_commit }}
          BUILD_RUN: ${{ steps.proof.outputs.build_run_id }}
          BUILD_ARTIFACT: ${{ steps.proof.outputs.artifact_id }}
          PUBLISHED_APK: ${{ steps.proof.outputs.published_apk }}
          LEGACY_RUN: ${{ inputs.verify_only && inputs.legacy_build_run || '' }}
        run: |
          cd "$RUNNER_TEMP/release-source-build"
          if [[ -z "$LEGACY_RUN" ]]; then
            test "$(cat source-commit.txt)" = "$SOURCE_COMMIT"
          fi
          shopt -s nullglob
          apks=(*.apk)
          test "${#apks[@]}" -eq 1
          result=$(env -u GH_TOKEN bash "$GITHUB_WORKSPACE/tooling/release/verify-apk-match.sh" "${apks[0]}" "$PUBLISHED_APK")
          printf '%s\n' "$result"
          {
            printf '## Byte-for-byte match for %s\n\n' "$TAG"
            printf 'The published APK matches the build from [source commit `%s`](%s/%s/commit/%s).\n\n' \
              "$SOURCE_COMMIT" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$SOURCE_COMMIT"
            printf '[Unsigned build run](%s/%s/actions/runs/%s) · [APK artifact %s](%s/%s/actions/runs/%s/artifacts/%s)\n\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$BUILD_RUN" \
              "$BUILD_ARTIFACT" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$BUILD_RUN" "$BUILD_ARTIFACT"
            printf '```text\n%s\n```\n' "$result"
          } >> "$GITHUB_STEP_SUMMARY"
