name: Debug APK (optional)
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: debug-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  debug-apk:
    name: Debug APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/disk-cleanup
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: cp tooling/gradle.properties.docker "$HOME/.gradle/gradle.properties"
      - run: ./gradlew --no-daemon :app:assembleProdWebsiteDebug
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: collie-debug-${{ github.event.pull_request.head.sha || github.sha }}
          path: app/build/outputs/apk/prodWebsite/debug/*.apk
          retention-days: 7
          if-no-files-found: error

  webview-acceptance:
    if: github.event_name == 'workflow_dispatch'
    name: Offline WebView acceptance on Android 15
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/disk-cleanup
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.14'
      - name: Install pinned screenshot decoder
        run: |
          printf '%s\n' 'Pillow==13.0.0 --hash=sha256:42d63be3af4f9b951b199b0a9d23365d37ab14687e6d77b74940432c8515c4ca' > "$RUNNER_TEMP/png-requirements.txt"
          python3 -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r "$RUNNER_TEMP/png-requirements.txt"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Record source and build matching APKs with the normal test runner
        id: build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/webview-acceptance
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD HEAD^{tree} > build/webview-acceptance/source.txt
          cp tooling/gradle.properties.docker "$HOME/.gradle/gradle.properties"
          ./gradlew --no-daemon --console=plain :app:assembleProdWebsiteDebug :app:assembleProdWebsiteDebugAndroidTest \
            2>&1 | tee build/webview-acceptance/build.log
          app_apks=(app/build/outputs/apk/prodWebsite/debug/*.apk)
          test_apks=(app/build/outputs/apk/androidTest/prodWebsite/debug/*.apk)
          test "${#app_apks[@]}" = 1 && test -f "${app_apks[0]}"
          test "${#test_apks[@]}" = 1 && test -f "${test_apks[0]}"
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print "${app_apks[0]}" > build/webview-acceptance/app-manifest.xml
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print "${test_apks[0]}" > build/webview-acceptance/test-manifest.xml
          sha256sum "${app_apks[0]}" "${test_apks[0]}" > build/webview-acceptance/apk-before.txt
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare isolated WebView tests
        run: |
          cat > "$RUNNER_TEMP/reuse-webview-apks.gradle" <<'GRADLE'
          def packageTasks = [':app:packageProdWebsiteDebug', ':app:packageProdWebsiteDebugAndroidTest']
          if (gradle.parent == null) {
            gradle.beforeProject { project ->
              project.tasks.configureEach { task ->
                if (packageTasks.contains(task.path)) {
                  task.onlyIf('reuse the previously built and hashed APK') { false }
                }
              }
            }
            gradle.taskGraph.whenReady { graph ->
              packageTasks.each { path ->
                if (!graph.hasTask(path)) throw new GradleException("Missing APK packaging task: $path")
              }
            }
          }
          GRADLE
          cat > "$RUNNER_TEMP/run-webview-acceptance.sh" <<'SH'
          set -euo pipefail
          evidence=build/webview-acceptance
          collect() {
            status=$?
            trap - EXIT
            printf '%s\n' "$status" > "$evidence/exit-code.txt"
            timeout 15s adb logcat -b all -d -t 12000 -v threadtime > "$evidence/logcat.txt" 2>&1 || true
            timeout 10s adb shell dumpsys connectivity > "$evidence/connectivity-after.txt" 2>&1 || true
            mkdir -p "$evidence/screenshots"
            timeout 30s adb pull /sdcard/Android/media/im.collie.app/webview-acceptance/. "$evidence/screenshots/" || true
            sha256sum app/build/outputs/apk/prodWebsite/debug/*.apk \
              app/build/outputs/apk/androidTest/prodWebsite/debug/*.apk > "$evidence/apk-after.txt" || true
            exit "$status"
          }
          trap collect EXIT
          timeout 10s adb shell getprop ro.build.version.sdk | tr -d '\r' > "$evidence/device-api.txt"
          test "$(cat "$evidence/device-api.txt")" = 35
          timeout 10s adb shell getprop ro.build.fingerprint > "$evidence/device-fingerprint.txt"
          timeout 10s adb shell dumpsys webviewupdate > "$evidence/webview-provider.txt"
          timeout 10s adb shell cmd connectivity airplane-mode enable
          timeout 10s adb shell svc wifi disable
          timeout 10s adb shell svc data disable
          test "$(timeout 10s adb shell settings get global airplane_mode_on | tr -d '\r')" = 1
          for i in {1..30}; do
            timeout 10s adb shell dumpsys connectivity > "$evidence/connectivity-before.txt"
            if grep -q 'Active default network: none' "$evidence/connectivity-before.txt"; then break; fi
            sleep 1
          done
          grep -q 'Active default network: none' "$evidence/connectivity-before.txt"
          timeout 10s adb logcat -c
          ./gradlew --no-daemon --console=plain \
            :app:packageProdWebsiteDebug :app:packageProdWebsiteDebugAndroidTest \
            :app:connectedProdWebsiteDebugAndroidTest -I "$RUNNER_TEMP/reuse-webview-apks.gradle" \
            '-Pandroid.testInstrumentationRunnerArguments.class=org.thoughtcrime.securesms.security.WebViewRuntimeAcceptanceTest' \
            2>&1 | tee "$evidence/connected.log"
          SH
      - name: Exercise six WebView flows offline
        id: device
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          ram-size: 2048M
          cores: 2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash "$RUNNER_TEMP/run-webview-acceptance.sh"
      - name: Require six tests, offline state, APK identity and screenshots
        if: always() && !cancelled()
        env:
          EXPECTED_SHA: ${{ github.sha }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          DEVICE_OUTCOME: ${{ steps.device.outcome }}
        run: python3 .github/scripts/check-webview-acceptance.py
      - name: Keep synthetic WebView evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webview-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/webview-acceptance
            app/build/outputs/androidTest-results
            app/build/reports/androidTests
          retention-days: 14
          if-no-files-found: error
