name: Publish prerelease
# Run after the maintainer pushes a signed tag and uploads collie.apk to a draft.
# This entry point publishes Collie only; TrailBlazer has a separate identity.
on:
  pull_request:
    paths:
      - tooling/release/**
      - .github/workflows/release.yml
      - .github/workflows/promote.yml
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v8.35.1-4-rc1
        required: true
      built_on:
        description: Where the release APK was built
        type: choice
        options: [local, github]
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'release-im.collie.app' || format('release-policy-pr-{0}', github.event.pull_request.number) }}
  cancel-in-progress: false
env:
  TAG: ${{ inputs.tag }}
  BUILT_ON: ${{ inputs.built_on }}
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  GH_HOST: github.com
jobs:
  policy-tests:
    name: Release publication policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tooling/release -p 'test_*.py' -v

  publish:
    needs: policy-tests
    if: github.event_name == 'workflow_dispatch' && github.repository == '0cwa/collieim-android' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out the exact trusted workflow and signer policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify the signed source, draft state and APK identity
        id: identity
        run: |
          mkdir -p "$RUNNER_TEMP/release-evidence"
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          python3 tooling/release/publication.py inspect --tag "$TAG" --purpose publish \
            --scratch "$RUNNER_TEMP/release-assets" --build-tools "$bt" \
            --output "$RUNNER_TEMP/release-evidence/before.json" --github-output "$GITHUB_OUTPUT"
      - name: Exact tag commit passed tests and the production build
        env:
          SOURCE_COMMIT: ${{ steps.identity.outputs.source_commit }}
        run: |
          python3 tooling/ci/verify_release_readiness.py \
            --repository "$GH_REPO" --sha "$SOURCE_COMMIT" \
            --report "$RUNNER_TEMP/release-evidence/ci.json"
      - name: Release notes exist in the release-engineering repo
        env:
          VERSION: ${{ steps.identity.outputs.version_name }}
        run: |
          curl -fsSL "https://raw.githubusercontent.com/0cwa/collie-release-engineering/main/distribution/release-notes/$VERSION.md" \
            -o "$RUNNER_TEMP/notes.md" \
            || { echo "::error::add distribution/release-notes/$VERSION.md to collie-release-engineering main"; exit 1; }
      - name: Record exact assets and publish a prerelease without changing Latest
        run: |
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          python3 tooling/release/publication.py publish \
            --identity "$RUNNER_TEMP/release-evidence/before.json" --built-on "$BUILT_ON" \
            --notes "$RUNNER_TEMP/notes.md" --scratch "$RUNNER_TEMP/release-assets" --build-tools "$bt" \
            --output "$RUNNER_TEMP/release-evidence/published.json"
      - name: Retain publication and exact-commit CI evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-evidence/*.json
          retention-days: 30
          if-no-files-found: warn
