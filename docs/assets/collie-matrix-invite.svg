  <title
     id="title">Join the Pack — Matrix community</title>
  <desc
     id="description">Collie community invitation. Manrope ExtraBold lettering, warm copper-to-orange left field, forest green right field, slender cream diagonal separator, pale lichen Matrix capsule. Text is optically centered.</desc>
