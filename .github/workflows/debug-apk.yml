name: Debug APK (optional)
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: debug-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  debug-apk:
    name: Debug APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/disk-cleanup
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: cp tooling/gradle.properties.docker "$HOME/.gradle/gradle.properties"
      - run: ./gradlew --no-daemon :app:assembleProdWebsiteDebug
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: collie-debug-${{ github.event.pull_request.head.sha || github.sha }}
          path: app/build/outputs/apk/prodWebsite/debug/*.apk
          retention-days: 7
          if-no-files-found: error
