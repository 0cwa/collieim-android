name: Molly patch release

on:
  pull_request:
  workflow_dispatch:
    inputs:
      instrumentation:
        description: Optional hosted instrumentation profiles
        type: choice
        required: true
        default: 'off'
        options:
          - 'off'
          - both
          - collie
          - collie-foss

permissions:
  contents: read

concurrency:
  group: molly-patch-release-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number }}
  cancel-in-progress: true

env:
  GIT_LFS_SKIP_SMUDGE: '1'
  GIT_TERMINAL_PROMPT: '0'

jobs:
  scope:
    name: Check stack scope and patch tools
    runs-on: ubuntu-24.04
    outputs:
      profile: ${{ steps.codeql_scope.outputs.profile || steps.scope.outputs.profile }}
      port: ${{ steps.codeql_scope.outputs.port || steps.scope.outputs.port }}
      stack_scope: ${{ steps.codeql_scope.outputs.stack_scope || steps.scope.outputs.stack_scope }}
      base: ${{ steps.codeql_scope.outputs.base || steps.scope.outputs.base }}
      integration_lower: ${{ steps.scope.outputs.integration_lower }}
      profiles: ${{ steps.codeql_scope.outputs.profiles || steps.scope.outputs.profiles }}
    steps:
      - name: Check out immutable head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          lfs: false
      - name: Validate CodeQL-only maintenance
        id: codeql_scope
        if: >-
          (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main') ||
          (github.event_name == 'workflow_dispatch' && github.ref_name == 'main' && inputs.instrumentation == 'off')
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          sys.path.insert(0, 'tools/patches')
          import scope

          proof = Path(os.environ['RUNNER_TEMP']) / 'codeql-maintenance-scope.json'
          proof.unlink(missing_ok=True)
          head = scope.git('.', 'rev-parse', '--verify', 'HEAD^{commit}').decode().strip()
          base = os.environ['BASE_SHA'] if os.environ['EVENT_NAME'] == 'pull_request' else head
          if not re.fullmatch(r'[0-9a-f]{40}', base):
              raise ValueError('Invalid main base SHA')
          if not scope.main_codeql_only('.', base, head):
              sys.exit(0)
          # Older main transitions retain their existing release checks.
          try:
              prior = json.loads(scope.git('.', 'show', base + ':molly-build.json'))
          except subprocess.CalledProcessError:
              sys.exit(0)
          if prior.get('signal', {}).get('commit') != scope.NEXT_PORT_SIGNAL:
              sys.exit(0)
          if os.environ['EVENT_NAME'] == 'workflow_dispatch':
              # A snapshot has no immediate diff. Only select this route when
              # the complete release state is still CodeQL-only maintenance.
              if subprocess.run(['git', 'merge-base', '--is-ancestor', scope.CODEQL_MAIN_BASE, head],
                                stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL).returncode:
                  sys.exit(0)
              if not scope.main_codeql_only('.', scope.CODEQL_MAIN_BASE, head):
                  sys.exit(0)
          # Classification alone never authorizes skipping application checks.
          # This validates ancestry, the cumulative PR38 projection, every
          # release input, required workflows and the exact application pin.
          result = scope.check_codeql_maintenance('.', base, head)
          if result.get('codeql_maintenance') is not True:
              raise ValueError('CodeQL maintenance was not fully validated')
          result.update(base=base, head=head)
          proof.write_text(json.dumps(result, indent=2) + '\n')
          PY
          if [[ ! -f "$RUNNER_TEMP/codeql-maintenance-scope.json" ]]; then
            echo 'validated=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 -m unittest discover -s tools/codeql -p 'test_*.py' -v
          node --test tools/codeql/test_spinner.mjs
          PYTHONPATH=tools/patches python3 -m unittest \
            tools/patches/test_codeql_scope.py \
            tools.patches.test_stack_scope.ScopeTests.test_main_maintenance_allows_patch_and_tool_work_but_rejects_source_edits \
            tools.patches.test_stack_scope.ScopeTests.test_main_maintenance_rejects_upstream_pin_and_forest_changes \
            tools.patches.test_stack_scope.ScopeTests.test_main_maintenance_and_snapshot_enforce_workflow_invariants \
            tools.patches.test_stack_scope.ScopeTests.test_main_maintenance_snapshot_detects_prior_direct_source_edit \
            tools/patches/test_ci_scope_mapping.py \
            tools/patches/test_main_snapshot.py \
            tools/patches/test_generated_stages.py \
            tools/patches/test_next_port_workflow.py \
            tools/patches/test_optional_instrumentation_workflow.py -v
          # Publish skip outputs only after full validation AND all tests pass.
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          result = json.loads((Path(os.environ['RUNNER_TEMP']) / 'codeql-maintenance-scope.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('validated=true\nprofile=false\nport=false\n')
              output.write('stack_scope=main-maintenance\nprofiles=[]\n')
              output.write('base=' + result['base'] + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('### Validated CodeQL maintenance\n\n')
              summary.write('Base: `' + result['base'] + '`\n\nHead: `' + result['head'] + '`\n\n')
              summary.write('Unchanged application tree: `' + result['application_tree'] + '`\n\n')
              summary.write('Release configuration, patch layers, native inputs and application sources match the reviewed PR38 boundary. ')
              summary.write('Security-tool and scope regressions passed. Application reconstruction and builds are unchanged and were not rerun.\n')
          PY
      - name: Validate scope and tests
        id: scope
        if: steps.codeql_scope.outputs.validated != 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.ref_name }}
        run: |
          # Resolve stacked Collie checks against the trusted repository, not the PR head remote.
          # A moved lower branch fails closed until the stack is synchronized.
          trusted_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          check_collie_base() {
            local immediate_base=$1
            [[ "$immediate_base" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid immediate base SHA' >&2; return 1; }
            git fetch --no-tags "$trusted_url" refs/heads/private/release-base-5
            base=$(git rev-parse --verify 'FETCH_HEAD^{commit}')
            git merge-base --is-ancestor "$base" "$immediate_base" || { echo 'Immediate base is outside trusted release history' >&2; return 1; }
            git merge-base --is-ancestor "$immediate_base" HEAD || { echo 'Immediate base is not an ancestor of head' >&2; return 1; }
          }
          if [[ "$EVENT_NAME" == pull_request ]]; then
            base="$BASE_SHA"
            case "$BASE_REF" in
              stack/0-molly-8.19.2-4) scope=pipeline ;;
              stack/1-patch-pipeline)
                if git cat-file -e HEAD:molly-build.json 2>/dev/null; then
                  scope=switch
                else
                  # A pipeline maintenance PR targets stack/1 itself, while a
                  # switch PR adds a profile on top of that same base.
                  # Require the head to include the current base: otherwise the
                  # checked head would not represent the proposed merge result.
                  anchor=0e202dda90785771ff8c87526eaaf30c655f54f3
                  git merge-base --is-ancestor "$base" HEAD || { echo 'Pipeline PR base is not an ancestor of head' >&2; exit 1; }
                  git merge-base --is-ancestor "$anchor" "$base" || { echo 'Pipeline PR base is outside official Molly history' >&2; exit 1; }
                  base="$anchor"; scope=pipeline
                fi ;;
              stack/2-molly-as-patchset) scope=release ;;
              stack/3-signal-8.33.2) scope=followups ;;
              stack/4-behavior-followups) scope=additions ;;
              stack/5-behavior-additions) scope=features ;;
              private/release-base-5) scope=forks ;;
              main)
                [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid main base SHA' >&2; exit 1; }
                git merge-base --is-ancestor "$BASE_SHA" HEAD || { echo 'Main base is not an ancestor of head' >&2; exit 1; }
                if python3 -c 'import json,subprocess,sys; b=json.loads(subprocess.check_output(["git", "show", sys.argv[1] + ":molly-build.json"])); h=json.load(open("molly-build.json")); target="a74583b01e260944f699c4da03ba4e8ce04de32b"; sys.exit(0 if h["signal"]["commit"] == target and b["signal"]["commit"] != target else 1)' "$BASE_SHA" 2>/dev/null; then
                  scope=next-port; base=7d486880ddc991af0d36f1e4709030255ef4dbad
                elif ! git cat-file -e "$BASE_SHA:molly-build.json" 2>/dev/null; then
                  scope=main-transition
                elif python3 -c 'import json, subprocess, sys; b=json.loads(subprocess.check_output(["git", "show", sys.argv[1] + ":molly-build.json"])); h=json.load(open("molly-build.json")); sys.exit(0 if "profiles" not in b and "profiles" in h else 1)' "$BASE_SHA"; then
                  scope=forks
                elif PYTHONPATH=tools/patches python3 -c 'import scope,sys; sys.exit(0 if scope.main_docs_only(".", sys.argv[1], "HEAD") else 1)' "$BASE_SHA"; then
                  scope=main-docs
                else
                  scope=main-maintenance
                fi
                if [[ "$scope" != main-docs && "$scope" != next-port ]]; then
                  integration_lower=7f0eb01a0ab472deeef3b528e7f508425044fa6a
                  git fetch --no-tags "$trusted_url" "$integration_lower"
                  [[ $(git rev-parse 'FETCH_HEAD^{commit}') == "$integration_lower" ]] || { echo 'Pinned base fetch mismatch' >&2; exit 1; }
                fi ;;
              private/release-variants)
                if python3 -c 'import json,sys; sys.exit(0 if json.load(open("molly-build.json"))["signal"]["commit"] == "a74583b01e260944f699c4da03ba4e8ce04de32b" else 1)'; then
                  scope=next-port; base="$BASE_SHA"
                  echo "::notice::APK build and device instrumentation not run: native integration incomplete."
                else
                  scope=forks; immediate_base=$BASE_SHA; check_collie_base "$immediate_base"
                fi ;;
              feature/collie-theme-pr17-126352)
                scope=forks; immediate_base=$BASE_SHA; check_collie_base "$immediate_base" ;;
              *) echo "Unknown base: $BASE_REF" >&2; exit 1 ;;
            esac
          elif [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            case "$HEAD_REF" in
              main)
                read -r scope base < <(python3 tools/patches/main_snapshot.py)
                [[ -n "$scope" && "$base" =~ ^[0-9a-f]{40}$ ]] || { echo 'Could not determine main snapshot base' >&2; exit 1; }
                integration_lower=7f0eb01a0ab472deeef3b528e7f508425044fa6a
                git fetch --no-tags "$trusted_url" "$integration_lower"
                [[ $(git rev-parse 'FETCH_HEAD^{commit}') == "$integration_lower" ]] || { echo 'Pinned base fetch mismatch' >&2; exit 1; }
                main_snapshot=1 ;;
              stack/1-patch-pipeline) scope=pipeline; base_ref=stack/0-molly-8.19.2-4 ;;
              stack/2-molly-as-patchset) scope=switch; base_ref=stack/1-patch-pipeline ;;
              stack/3-signal-8.33.2) scope=release; base_ref=stack/2-molly-as-patchset ;;
              stack/4-behavior-followups) scope=followups; base_ref=stack/3-signal-8.33.2 ;;
              stack/5-behavior-additions) scope=additions; base_ref=stack/4-behavior-followups ;;
              feature/foss-8.33.2) scope=features; base_ref=stack/5-behavior-additions ;;
              private/release-variants) scope=forks; base_ref=private/release-base-5 ;;
              feature/collie-theme-pr17-126352) scope=forks; base_ref=private/release-variants; collie_stack=1 ;;
              feature/collie-donation-pr17-126352) scope=forks; base_ref=feature/collie-theme-pr17-126352; collie_stack=1 ;;
              *) echo "Unknown branch: $HEAD_REF" >&2; exit 1 ;;
            esac
            if [[ ${main_snapshot:-} == 1 ]]; then
              : # The snapshot base was selected from trusted main first-parent history.
            elif [[ ${collie_stack:-} == 1 ]]; then
              git fetch --no-tags "$trusted_url" "refs/heads/$base_ref"
              immediate_base=$(git rev-parse --verify 'FETCH_HEAD^{commit}')
              check_collie_base "$immediate_base"
            else
              git fetch --no-tags origin "refs/heads/$base_ref:refs/remotes/origin/$base_ref"
              base="refs/remotes/origin/$base_ref"
            fi
          else
            echo "Unsupported event" >&2; exit 1
          fi
          if [[ -n ${immediate_base:-} ]]; then
            python3 tools/patches/check_collie_scope.py --base "$immediate_base"
          fi
          if [[ "$scope" == release || "$scope" == followups || "$scope" == additions || "$scope" == features || "$scope" == forks || "$scope" == next-port || "$scope" == main-maintenance || "$scope" == main-transition || "$scope" == main-snapshot || "$scope" == main-snapshot-transition ]]; then
            python3 tools/patches/prepare_port_report.py
          fi
          if [[ "$scope" == forks || "$scope" == main-snapshot ]]; then
            python3 tools/patches/fetch_reviewed_profiles.py "$trusted_url"
          fi
          scope_extra=()
          if [[ -n ${integration_lower:-} ]]; then
            scope_extra+=(--integration-lower "$integration_lower")
          fi
          python3 tools/patches/scope.py --scope "$scope" --base "$base" "${scope_extra[@]}"
          echo "integration_lower=${integration_lower:-}" >> "$GITHUB_OUTPUT"
          echo "stack_scope=$scope" >> "$GITHUB_OUTPUT"
          echo "base=$(git rev-parse "$base^{commit}")" >> "$GITHUB_OUTPUT"
          python3 -m unittest discover -s tools/patches -p 'test_*.py' -v
          if [[ "$scope" == release || "$scope" == followups || "$scope" == additions || "$scope" == features || "$scope" == forks || "$scope" == next-port || "$scope" == main-maintenance || "$scope" == main-transition || "$scope" == main-snapshot || "$scope" == main-snapshot-transition ]]; then
            python3 tools/patches/verify_source_bundles.py
            python3 tools/patches/port_report.py --check
            echo 'port=true' >> "$GITHUB_OUTPUT"
          else
            echo 'port=false' >> "$GITHUB_OUTPUT"
          fi
          if [[ "$scope" == pipeline || "$scope" == main-docs ]]; then echo 'profile=false' >> "$GITHUB_OUTPUT"; else echo 'profile=true' >> "$GITHUB_OUTPUT"; fi
          # The release line builds every named release profile; other branches build their one configuration.
          if [[ "$scope" == forks || "$scope" == next-port || "$scope" == main-snapshot || ( "$scope" == main-maintenance && $(python3 -c 'import json; print("yes" if "profiles" in json.load(open("molly-build.json")) else "no")') == yes ) ]]; then
            echo 'profiles=["molly-minimal","molly-continued","molly-foss-continued","collie","collie-foss"]' >> "$GITHUB_OUTPUT"
          else
            echo 'profiles=[""]' >> "$GITHUB_OUTPUT"
          fi

  source-proof:
    needs: scope
    if: needs.scope.outputs.profile == 'true'
    name: Prove source reconstruction and upstream provenance${{ matrix.profile && format(' ({0})', matrix.profile) || '' }}
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(needs.scope.outputs.profiles) }}
    env:
      PROFILE_ARGS: ${{ matrix.profile && format('--profile {0}', matrix.profile) || '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the exact PR head with full commit history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          lfs: false

      - name: Test patch tools without an Android SDK or network
        run: python3 -m unittest discover -s tools/patches -p 'test_*.py' -v

      - name: Test the optional native provenance and artifact checks
        run: |
          if [[ -d tools/native ]]; then
            PYTHONPATH=tools/patches python3 -m unittest discover -s tools/native -p 'test_*.py' -v
          fi

      - name: Fetch the exact official Molly source oracle
        run: |
          git fetch --no-tags https://github.com/mollyim/mollyim-android.git \
            0e202dda90785771ff8c87526eaaf30c655f54f3

      - name: Reconstruct the selected release and prove its complete tree
        env:
          INTEGRATION_LOWER: ${{ needs.scope.outputs.integration_lower }}
          STACK_SCOPE: ${{ needs.scope.outputs.stack_scope }}
          SCOPE_BASE: ${{ needs.scope.outputs.base }}
          HAS_PORT: ${{ needs.scope.outputs.port }}
        run: |
          scope_extra=()
          if [[ -n "$INTEGRATION_LOWER" ]]; then
            [[ "$INTEGRATION_LOWER" == 7f0eb01a0ab472deeef3b528e7f508425044fa6a ]] || { echo 'Unexpected integration base' >&2; exit 1; }
            git fetch --no-tags "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" "$INTEGRATION_LOWER"
            [[ $(git rev-parse 'FETCH_HEAD^{commit}') == "$INTEGRATION_LOWER" ]] || { echo 'Pinned base fetch mismatch' >&2; exit 1; }
            scope_extra+=(--integration-lower "$INTEGRATION_LOWER")
          fi
          if [[ "$STACK_SCOPE" == forks || "$STACK_SCOPE" == main-snapshot ]]; then
            python3 tools/patches/fetch_reviewed_profiles.py "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          fi
          if [[ "$HAS_PORT" == true ]]; then
            python3 tools/patches/prepare_port_report.py
          fi
          python3 tools/patches/release.py --repo . --config molly-build.json \
            --worktree "$RUNNER_TEMP/molly-release" \
            --report "$RUNNER_TEMP/reports/source.json" \
            --scope "$STACK_SCOPE" --base "$SCOPE_BASE" "${scope_extra[@]}" $PROFILE_ARGS

      - name: Prove the upstream native cherry-pick when configured
        if: needs.scope.outputs.stack_scope != 'next-port'
        run: |
          python3 tools/patches/build.py native-prepare \
            --worktree "$RUNNER_TEMP/molly-release" --report-dir "$RUNNER_TEMP/reports" $PROFILE_ARGS

      - name: Upload source and native provenance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.profile || 'molly' }}-source-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/reports
          if-no-files-found: warn

  android:
    if: needs.scope.outputs.stack_scope != 'next-port' && needs.scope.outputs.profile == 'true'
    name: Build the proved source and run its regression tests${{ matrix.profile && format(' ({0})', matrix.profile) || '' }}
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(needs.scope.outputs.profiles) }}
    env:
      PROFILE_ARGS: ${{ matrix.profile && format('--profile {0}', matrix.profile) || '' }}
    needs: [scope, source-proof]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out the same immutable PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          lfs: false

      - name: Fetch the pinned official Molly history
        run: |
          git fetch --no-tags https://github.com/mollyim/mollyim-android.git \
            0e202dda90785771ff8c87526eaaf30c655f54f3

      # Worktrees are machine-local. Reconstruct on this runner instead of
      # trusting a tarball whose .git file points to a different runner.
      - name: Materialize and verify the source on the build runner
        env:
          INTEGRATION_LOWER: ${{ needs.scope.outputs.integration_lower }}
          STACK_SCOPE: ${{ needs.scope.outputs.stack_scope }}
          SCOPE_BASE: ${{ needs.scope.outputs.base }}
          HAS_PORT: ${{ needs.scope.outputs.port }}
        run: |
          scope_extra=()
          if [[ -n "$INTEGRATION_LOWER" ]]; then
            [[ "$INTEGRATION_LOWER" == 7f0eb01a0ab472deeef3b528e7f508425044fa6a ]] || { echo 'Unexpected integration base' >&2; exit 1; }
            git fetch --no-tags "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" "$INTEGRATION_LOWER"
            [[ $(git rev-parse 'FETCH_HEAD^{commit}') == "$INTEGRATION_LOWER" ]] || { echo 'Pinned base fetch mismatch' >&2; exit 1; }
            scope_extra+=(--integration-lower "$INTEGRATION_LOWER")
          fi
          if [[ "$STACK_SCOPE" == forks || "$STACK_SCOPE" == main-snapshot ]]; then
            python3 tools/patches/fetch_reviewed_profiles.py "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          fi
          if [[ "$HAS_PORT" == true ]]; then
            python3 tools/patches/prepare_port_report.py
          fi
          python3 tools/patches/release.py --repo . --config molly-build.json \
            --worktree "$RUNNER_TEMP/molly-release" \
            --report "$RUNNER_TEMP/reports/source.json" \
            --scope "$STACK_SCOPE" --base "$SCOPE_BASE" "${scope_extra[@]}" $PROFILE_ARGS

      - name: Prepare the optional native backport from its immutable sources
        run: |
          python3 tools/patches/build.py native-prepare \
            --worktree "$RUNNER_TEMP/molly-release" --report-dir "$RUNNER_TEMP/reports" $PROFILE_ARGS

      # The historical hotfix uses the original native API and all three Molly
      # ABIs. A resource, native-test or build failure stops the job; it must not
      # silently select the old published AAR or a partial architecture build.
      - name: Test and build all required native ABIs when configured
        run: |
          python3 tools/patches/build.py native-build \
            --worktree "$RUNNER_TEMP/molly-release" --report-dir "$RUNNER_TEMP/reports" $PROFILE_ARGS

      - name: Integrate the verified native artifact without disabling verification
        run: |
          python3 tools/patches/build.py native-integrate \
            --worktree "$RUNNER_TEMP/molly-release" --report-dir "$RUNNER_TEMP/reports" $PROFILE_ARGS

      - name: Set up JDK 21
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle with a read-only cache
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          cache-read-only: true

      - name: Install the profile's pinned Android SDK components
        run: |
          python3 tools/patches/build.py sdk \
            --worktree "$RUNNER_TEMP/molly-release" --report-dir "$RUNNER_TEMP/reports" $PROFILE_ARGS

      - name: Assemble the Website debug APK with strict dependency verification
        run: |
          python3 tools/patches/build.py assemble \
            --worktree "$RUNNER_TEMP/molly-release" --report-dir "$RUNNER_TEMP/reports" $PROFILE_ARGS

      - name: Run the profile's regression test tasks
        run: |
          python3 tools/patches/build.py test \
            --worktree "$RUNNER_TEMP/molly-release" --report-dir "$RUNNER_TEMP/reports" $PROFILE_ARGS

      - name: Upload proof, build logs, native artifacts, APKs and test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.profile || 'molly' }}-android-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/reports
            ${{ runner.temp }}/molly-ringrtc-maven/im/molly/ringrtc-android
            ${{ runner.temp }}/molly-release/**/build/reports
            ${{ runner.temp }}/molly-release/**/build/test-results
            ${{ runner.temp }}/molly-release/app/build/outputs/apk/prodWebsite/debug

      - name: Clear default build outputs before Firebase-free validation
        id: foss_prepare
        if: ${{ hashFiles('patches/ports/signal-8.33.2/followups/firebase-free-build/series') != '' }}
        run: |
          mkdir -p "$RUNNER_TEMP/foss-reports"
          cp -- "$RUNNER_TEMP/reports/source.json" "$RUNNER_TEMP/foss-reports/source.json"
          rm -rf -- "$RUNNER_TEMP/molly-release/app/build/outputs/apk/prodWebsite/debug"
          find "$RUNNER_TEMP/molly-release" -type d \
            \( -path '*/build/reports' -o -path '*/build/test-results' \) -prune -exec rm -rf -- {} +

      - name: Assemble the Firebase-free Website debug APK
        id: foss_assemble
        if: ${{ steps.foss_prepare.outcome == 'success' }}
        env:
          ORG_GRADLE_PROJECT_mollyFirebaseFree: 'true'
        run: |
          python3 tools/patches/build.py assemble \
            --worktree "$RUNNER_TEMP/molly-release" --report-dir "$RUNNER_TEMP/foss-reports"

      - name: Run the Firebase-free profile regression test tasks
        if: ${{ hashFiles('patches/ports/signal-8.33.2/followups/firebase-free-build/series') != '' }}
        env:
          ORG_GRADLE_PROJECT_mollyFirebaseFree: 'true'
        run: |
          python3 tools/patches/build.py test \
            --worktree "$RUNNER_TEMP/molly-release" --report-dir "$RUNNER_TEMP/foss-reports"

      - name: Upload Firebase-free build logs and test results
        if: ${{ always() && steps.foss_prepare.outcome == 'success' && steps.foss_assemble.outcome != '' && steps.foss_assemble.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: molly-android-firebase-free-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/foss-reports
            ${{ runner.temp }}/molly-release/**/build/reports
            ${{ runner.temp }}/molly-release/**/build/test-results

      - name: Upload the Firebase-free APK after successful assembly
        if: ${{ always() && steps.foss_assemble.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: molly-android-firebase-free-apk-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: ${{ runner.temp }}/molly-release/app/build/outputs/apk/prodWebsite/debug

  instrumentation:
    name: Instrumentation on reconstructed ${{ matrix.profile }}
    needs: [scope, source-proof]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      needs.scope.outputs.profiles != '[]' &&
      (inputs.instrumentation == 'both' || inputs.instrumentation == 'collie' || inputs.instrumentation == 'collie-foss') &&
      (needs.scope.outputs.stack_scope == 'forks' || needs.scope.outputs.stack_scope == 'main-snapshot' || (needs.scope.outputs.stack_scope == 'main-maintenance' && needs.scope.outputs.profiles != '[""]'))
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(inputs.instrumentation == 'both' && '["collie","collie-foss"]' || inputs.instrumentation == 'collie-foss' && '["collie-foss"]' || '["collie"]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Free space for the instrumentation emulator
        run: |
          # Hosted runners are disposable; retain their Android SDK and Java tools.
          df -h "$RUNNER_TEMP"
          sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/local/.ghcup /usr/local/julia*
          df -h "$RUNNER_TEMP"
      - name: Check out the exact head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          lfs: false
      - name: Record instrumentation inputs
        run: |
          mkdir -p "$RUNNER_TEMP/instrumentation"
          printf 'commit=%s\nprofile=%s\napi=%s\nsuites=%s\n' "$(git rev-parse HEAD)" '${{ matrix.profile }}' '35' 'default,imo' | tee "$RUNNER_TEMP/instrumentation/run-context.txt"
      - name: Reconstruct the selected actual fork source
        env:
          INTEGRATION_LOWER: ${{ needs.scope.outputs.integration_lower }}
          STACK_SCOPE: ${{ needs.scope.outputs.stack_scope }}
          SCOPE_BASE: ${{ needs.scope.outputs.base }}
          HAS_PORT: ${{ needs.scope.outputs.port }}
        run: |
          git fetch --no-tags https://github.com/mollyim/mollyim-android.git 0e202dda90785771ff8c87526eaaf30c655f54f3
          scope_extra=()
          if [[ -n "$INTEGRATION_LOWER" ]]; then
            [[ "$INTEGRATION_LOWER" == 7f0eb01a0ab472deeef3b528e7f508425044fa6a ]] || { echo 'Unexpected integration base' >&2; exit 1; }
            git fetch --no-tags "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" "$INTEGRATION_LOWER"
            [[ $(git rev-parse 'FETCH_HEAD^{commit}') == "$INTEGRATION_LOWER" ]] || { echo 'Pinned base fetch mismatch' >&2; exit 1; }
            scope_extra+=(--integration-lower "$INTEGRATION_LOWER")
          fi
          python3 tools/patches/fetch_reviewed_profiles.py "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          python3 tools/patches/prepare_port_report.py
          python3 tools/patches/release.py --repo . --config molly-build.json \
            --worktree "$RUNNER_TEMP/molly-instrumentation" --report "$RUNNER_TEMP/instrumentation/source.json" \
            --scope "$STACK_SCOPE" --base "$SCOPE_BASE" "${scope_extra[@]}" --profile '${{ matrix.profile }}'
          python3 tools/patches/build.py native-prepare --worktree "$RUNNER_TEMP/molly-instrumentation" --report-dir "$RUNNER_TEMP/instrumentation" --profile '${{ matrix.profile }}'
          python3 tools/patches/build.py native-build --worktree "$RUNNER_TEMP/molly-instrumentation" --report-dir "$RUNNER_TEMP/instrumentation" --profile '${{ matrix.profile }}'
          python3 tools/patches/build.py native-integrate --worktree "$RUNNER_TEMP/molly-instrumentation" --report-dir "$RUNNER_TEMP/instrumentation" --profile '${{ matrix.profile }}'
      - name: Set up JDK 21
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          cache-read-only: true
      - name: Install Android SDK
        run: |
          python3 tools/patches/build.py sdk --worktree "$RUNNER_TEMP/molly-instrumentation" --report-dir "$RUNNER_TEMP/instrumentation" --profile '${{ matrix.profile }}'
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'emulator' 'system-images;android-35;google_apis;x86_64'
      - name: Run default and IMO instrumentation on a disposable emulator
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          test -w /dev/kvm || sudo chmod a+rw /dev/kvm
          echo 'no' | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n instrumentation -k 'system-images;android-35;google_apis;x86_64' --force
          test -s "$ANDROID_AVD_HOME/instrumentation.ini"
          source tools/patches/emulator_startup.sh
          check_avd_disk_space
          # Start a foreground traced server before the emulator or any adb client.
          # The wrapper refuses to replace an existing server; this job uses a fresh runner.
          python3 tools/patches/adb_trace_server.py "$RUNNER_TEMP/instrumentation" &
          adb_trace_pid=$!
          emulator_pid=
          diagnostics_pid=
          cleanup() {
            if [[ -n "$diagnostics_pid" ]]; then
              kill "$diagnostics_pid" 2>/dev/null || true
              wait "$diagnostics_pid" || true
            fi
            if [[ -n "$emulator_pid" ]]; then kill "$emulator_pid" 2>/dev/null || true; fi
            kill "$adb_trace_pid" 2>/dev/null || true
            wait "$adb_trace_pid" || true
          }
          trap cleanup EXIT
          for attempt in {1..50}; do
            kill -0 "$adb_trace_pid" 2>/dev/null || { echo 'Traced ADB server exited' >&2; exit 1; }
            if (echo > /dev/tcp/127.0.0.1/5037) 2>/dev/null; then break; fi
            sleep .1
          done
          (echo > /dev/tcp/127.0.0.1/5037) 2>/dev/null || { echo 'Traced ADB server did not start' >&2; exit 1; }
          "$ANDROID_HOME/emulator/emulator" -avd instrumentation -no-window -no-audio -no-boot-anim -gpu swangle &
          emulator_pid=$!
          wait_for_emulator_boot "$emulator_pid"
          # This fresh CI emulator contains synthetic test data only; do not use real accounts.
          python3 tools/patches/instrumentation_diagnostics.py "$RUNNER_TEMP/instrumentation" emulator-5554 &
          diagnostics_pid=$!
          tools/patches/instrumentation_gate.sh "$RUNNER_TEMP/molly-instrumentation" "$RUNNER_TEMP/instrumentation" '${{ matrix.profile }}'
      - name: Upload instrumentation results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.profile }}-instrumentation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/instrumentation
            !${{ runner.temp }}/instrumentation/**/*.tmp
          if-no-files-found: warn
