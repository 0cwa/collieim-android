name: PR checks
on:
  pull_request:
permissions:
  contents: read
jobs:
  combined-backup-tests:
    name: Four existing backup and stream test classes
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/disk-cleanup
      - name: Record exact validation source
        run: |
          mkdir -p build/ci
          {
            printf 'commit '
            git rev-parse HEAD
            printf 'tree '
            git rev-parse HEAD^{tree}
            printf 'parents '
            git show -s --format=%P HEAD
          } | tee build/ci/combined-backup-source.txt
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: cp tooling/gradle.properties.docker "$HOME/.gradle/gradle.properties"
      - name: Cache test-only libsignal JNI
        id: host-jni-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            build/host-tests/resources
            build/host-tests/receipt.json
          key: host-libsignal-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build-inputs/native-lock.json', 'build-inputs/engineering.json', 'build-inputs/host-test-inputs.json', 'tooling/host-tests/build_libsignal.py') }}
      - name: Build pinned Linux JNI for unit tests
        if: steps.host-jni-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang libclang-dev cmake make protobuf-compiler libprotobuf-dev binutils
          rust_version=$(python3 -c 'import json; print(json.load(open("build-inputs/native-lock.json"))["toolchain_reference"]["rust_version"])')
          rustup toolchain install "$rust_version" --profile minimal
          python3 tooling/host-tests/build_libsignal.py
      - name: Verify test-only libsignal JNI
        run: python3 tooling/host-tests/build_libsignal.py --verify-only
      - name: Run LimitedInputStream tests
        run: |
          ./gradlew --no-daemon -PcollieHostJniDir=build/host-tests/resources \
            :core:util-jvm:test --tests org.signal.core.util.stream.LimitedInputStreamTest
      - name: Run authenticated export and snapshot tests
        run: |
          ./gradlew --no-daemon -PcollieHostJniDir=build/host-tests/resources \
            :app:testProdWebsiteDebugUnitTest \
            --tests org.thoughtcrime.securesms.backup.v2.stream.AuthenticatedPlaintextExportTest \
            --tests org.thoughtcrime.securesms.backup.v2.EncryptedBackupSnapshotTest \
            --tests org.thoughtcrime.securesms.backup.v2.BlobProviderInitializationTest
      - name: Require exactly the four reviewed test classes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys
          import xml.etree.ElementTree as ET

          expected = {
              "org.signal.core.util.stream.LimitedInputStreamTest": 17,
              "org.thoughtcrime.securesms.backup.v2.stream.AuthenticatedPlaintextExportTest": 7,
              "org.thoughtcrime.securesms.backup.v2.EncryptedBackupSnapshotTest": 3,
              "org.thoughtcrime.securesms.backup.v2.BlobProviderInitializationTest": 1,
          }
          roots = [Path("core/util-jvm/build/test-results/test"), Path("app/build/test-results/testProdWebsiteDebugUnitTest")]
          found = {}
          failures = []
          for base in roots:
              for path in base.rglob("TEST-*.xml"):
                  root = ET.parse(path).getroot()
                  suites = [root] if root.tag == "testsuite" else list(root.findall("testsuite"))
                  for suite in suites:
                      name = suite.attrib.get("name", "")
                      if name not in expected:
                          continue
                      if name in found:
                          failures.append(f"duplicate report for {name}")
                          continue
                      cases = suite.findall("testcase")
                      case_names = [case.attrib.get("name", "") for case in cases]
                      counts = {key: int(suite.attrib.get(key, "0")) for key in ("tests", "failures", "errors", "skipped")}
                      found[name] = (counts, case_names, path)
          for name, expected_count in expected.items():
              if name not in found:
                  failures.append(f"missing report for {name}")
                  continue
              counts, names, path = found[name]
              print(f"{name}: tests={counts['tests']} failures={counts['failures']} errors={counts['errors']} skipped={counts['skipped']} report={path}")
              for case_name in names:
                  print(f"  {case_name}")
              if counts != {"tests": expected_count, "failures": 0, "errors": 0, "skipped": 0}:
                  failures.append(f"unexpected counts for {name}: {counts}")
          if set(found) != set(expected):
              failures.append("unexpected test classes were collected")
          if failures:
              print("\n".join(failures), file=sys.stderr)
              sys.exit(1)
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: combined-backup-reader-unit-proof
          path: |
            build/ci/combined-backup-source.txt
            core/util-jvm/build/test-results/test
            app/build/test-results/testProdWebsiteDebugUnitTest
          if-no-files-found: error
          retention-days: 7
