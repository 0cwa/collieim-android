name: PR checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  layer-trailers:
    name: Layer trailers
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Every non-merge commit names its feature layer
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          missing=0
          for c in $(git rev-list --no-merges "$BASE..HEAD"); do
            layer=$(git log -1 --format='%(trailers:key=Layer,valueonly,separator=%x2C)' "$c")
            if ! [[ "$layer" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
              echo "::error::$(git log -1 --format='%h %s' "$c") needs one 'Layer: <feature>' trailer (lowercase, hyphens)"
              missing=1
            fi
          done
          exit $missing

  fastlane-metadata:
    name: Fastlane metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 tooling/fastlane/check_metadata.py

  fast-lint:
    name: Fast lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: cp tooling/gradle.properties.docker "$HOME/.gradle/gradle.properties"
      - name: Fail only on findings in changed files
        # The codebase carries 24 inherited findings (mostly Molly's core/gms shims); they are
        # reported here but do not block. New findings in files this change touches do.
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          ./gradlew --no-daemon :fast-lint:fastLint || true
          report=tooling/fast-lint/build/reports/fast-lint/findings.txt
          test -f "$report"
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ]; then
            git fetch --depth=1 origin main; BASE=FETCH_HEAD
          else
            git fetch --depth=1 origin "$BASE"
          fi
          grep -E '^  [^ ]+:[0-9]+: ' "$report" > "$RUNNER_TEMP/all.txt" || true
          git diff --name-only "$BASE" HEAD | sed 's/^/  /; s/$/:/' > "$RUNNER_TEMP/changed.txt"
          grep -F -f "$RUNNER_TEMP/changed.txt" "$RUNNER_TEMP/all.txt" > "$RUNNER_TEMP/new.txt" || true
          echo "Findings: $(wc -l < "$RUNNER_TEMP/all.txt") total, $(wc -l < "$RUNNER_TEMP/new.txt") in changed files"
          if [ -s "$RUNNER_TEMP/new.txt" ]; then cat "$RUNNER_TEMP/new.txt"; exit 1; fi

  unit-tests:
    name: Security stack JVM validation
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # Validation-only branch: production sources must match this exact app commit.
      FINAL_APP_SHA: 02f2fc026ff5eab58e130dc2c1a2eeebd0d0058d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify pinned app production source
        run: |
          git fetch --no-tags --depth=1 origin "$FINAL_APP_SHA"
          python3 .github/scripts/verify-security-stack-source.py "$FINAL_APP_SHA"
      - uses: ./.github/actions/disk-cleanup
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.14'
      - name: Install pinned PNG decoder
        run: |
          printf '%s\n' 'Pillow==13.0.0 --hash=sha256:42d63be3af4f9b951b199b0a9d23365d37ab14687e6d77b74940432c8515c4ca' > "$RUNNER_TEMP/png-requirements.txt"
          python3 -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r "$RUNNER_TEMP/png-requirements.txt"
      - name: Check host-test tooling
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tooling/host-tests -p 'test_*.py'
      - name: Cache test-only libsignal JNI
        id: host-jni-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            build/host-tests/resources
            build/host-tests/receipt.json
          key: host-libsignal-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build-inputs/native-lock.json', 'build-inputs/engineering.json', 'build-inputs/host-test-inputs.json', 'tooling/host-tests/build_libsignal.py') }}
      - name: Build pinned Linux JNI for unit tests
        if: steps.host-jni-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang libclang-dev cmake make protobuf-compiler libprotobuf-dev binutils
          rust_version=$(python3 -c 'import json; print(json.load(open("build-inputs/native-lock.json"))["toolchain_reference"]["rust_version"])')
          rustup toolchain install "$rust_version" --profile minimal
          python3 tooling/host-tests/build_libsignal.py
      - name: Verify test-only libsignal JNI
        run: python3 tooling/host-tests/build_libsignal.py --verify-only
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: cp tooling/gradle.properties.docker "$HOME/.gradle/gradle.properties"
      - name: Run focused security and upstream regression tests
        shell: bash
        run: |
          ./gradlew --no-daemon --continue -PcollieHostJniDir=build/host-tests/resources \
            :app:testProdWebsiteDebugUnitTest --rerun \
            --tests org.thoughtcrime.securesms.backup.MollyBackupPreferencesTest \
            --tests org.thoughtcrime.securesms.jobs.UnifiedPushRefreshJobTest \
            --tests org.thoughtcrime.securesms.apkupdate.CollieUpdateIndexTest \
            --tests org.thoughtcrime.securesms.jobs.ApkUpdateJobTest \
            --tests org.thoughtcrime.securesms.components.settings.app.updates.AppUpdatesSettingsViewModelTest \
            :feature:app-settings:testDebugUnitTest --rerun \
            --tests org.signal.appsettings.updates.AppUpdatesSettingsScreenTest \
            :core:util:testDebugUnitTest --rerun \
            --tests org.signal.core.util.money.FiatMoneyTest \
            2>&1 | tee build/security-validation/gradle.log
      - name: Require every expected class to pass without skipped tests
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/check-unit-test-results.py
      - name: Recheck pinned source after tests
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/verify-security-stack-source.py "$FINAL_APP_SHA"
      - name: Keep reports, source verification, and native build receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-stack-jvm-${{ github.run_id }}
          path: |
            **/build/reports/tests
            **/build/test-results
            build/host-tests/receipt.json
            build/security-validation
          if-no-files-found: error
