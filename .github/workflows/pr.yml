name: PR checks
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, release/stable/8.35]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  stable-tag-ref:
    name: Stable tag ref marker
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/tags/release/stable/8.35'
    permissions: {}
    runs-on: ubuntu-24.04
    steps:
      - run: test "$GITHUB_REF" = refs/tags/release/stable/8.35

  layer-trailers:
    name: Layer trailers
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Every non-merge commit names its feature layer
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          COLLIE_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git show "$BASE:tooling/git-hooks/collie_check_layer_trailers.py" > "$RUNNER_TEMP/collie_check_layer_trailers.py"
          python3 "$RUNNER_TEMP/collie_check_layer_trailers.py" range "$BASE" HEAD
      - name: Check commit and push hooks against real Git repositories
        if: ${{ hashFiles('tooling/git-hooks/test_*.py') != '' }}
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tooling/git-hooks -p 'test_*.py'

  fastlane-metadata:
    name: Fastlane metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 tooling/fastlane/check_metadata.py

  fast-lint:
    name: Fast lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: cp tooling/gradle.properties.docker "$HOME/.gradle/gradle.properties"
      - name: Fail only on findings in changed files
        # The codebase carries 24 inherited findings (mostly Molly's core/gms shims); they are
        # reported here but do not block. New findings in files this change touches do.
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          ./gradlew --no-daemon :fast-lint:fastLint || true
          report=tooling/fast-lint/build/reports/fast-lint/findings.txt
          test -f "$report"
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ]; then
            git fetch --depth=1 origin main; BASE=FETCH_HEAD
          else
            git fetch --depth=1 origin "$BASE"
          fi
          grep -E '^  [^ ]+:[0-9]+: ' "$report" > "$RUNNER_TEMP/all.txt" || true
          git diff --name-only "$BASE" HEAD | sed 's/^/  /; s/$/:/' > "$RUNNER_TEMP/changed.txt"
          grep -F -f "$RUNNER_TEMP/changed.txt" "$RUNNER_TEMP/all.txt" > "$RUNNER_TEMP/new.txt" || true
          echo "Findings: $(wc -l < "$RUNNER_TEMP/all.txt") total, $(wc -l < "$RUNNER_TEMP/new.txt") in changed files"
          if [ -s "$RUNNER_TEMP/new.txt" ]; then cat "$RUNNER_TEMP/new.txt"; exit 1; fi

  unit-test-shards:
    name: Unit tests (${{ matrix.shard }})
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.draft) }}
    strategy:
      fail-fast: false
      matrix:
        shard: [app-0, app-1, modules]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/disk-cleanup
      - name: Check host-test tooling
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tooling/host-tests -p 'test_*.py'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.14'
      - name: Install pinned screenshot decoder
        run: |
          printf '%s\n' 'Pillow==13.0.0 --hash=sha256:42d63be3af4f9b951b199b0a9d23365d37ab14687e6d77b74940432c8515c4ca' > "$RUNNER_TEMP/png-requirements.txt"
          python3 -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r "$RUNNER_TEMP/png-requirements.txt"
      - name: Check CI result gates
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tooling/ci -p 'test_*.py'
      - name: Record the tested source
        run: |
          mkdir -p build/ci
          git rev-parse HEAD > build/ci/source-commit.txt
          git rev-parse HEAD^{tree} > build/ci/source-tree.txt
      - name: Cache test-only libsignal JNI
        id: host-jni-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            build/host-tests/resources
            build/host-tests/receipt.json
          key: host-libsignal-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build-inputs/native-lock.json', 'build-inputs/engineering.json', 'build-inputs/host-test-inputs.json', 'tooling/host-tests/build_libsignal.py') }}
      - name: Build pinned Linux JNI for unit tests
        if: steps.host-jni-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang libclang-dev cmake make protobuf-compiler libprotobuf-dev binutils
          rust_version=$(python3 -c 'import json; print(json.load(open("build-inputs/native-lock.json"))["toolchain_reference"]["rust_version"])')
          rustup toolchain install "$rust_version" --profile minimal
          python3 tooling/host-tests/build_libsignal.py
      - name: Verify test-only libsignal JNI
        run: python3 tooling/host-tests/build_libsignal.py --verify-only
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: cp tooling/gradle.properties.docker "$HOME/.gradle/gradle.properties"
      # Robolectric downloads its android-all jars from Maven Central into ~/.m2 at
      # test time, and Central rate-limits CI runners (HTTP 429). Keep them in the cache.
      - name: Restore Robolectric android-all jars
        id: robolectric-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-jars-${{ runner.os }}-4.16-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            robolectric-jars-${{ runner.os }}-4.16-${{ matrix.shard }}-
            robolectric-jars-${{ runner.os }}-4.16-
      - name: Show Robolectric jar cache
        run: |
          echo "cache hit: ${{ steps.robolectric-cache.outputs.cache-matched-key || 'none' }}"
          find "$HOME/.m2/repository/org/robolectric" -name '*.jar' 2>/dev/null | sort || true
      # Robolectric downloads a missing android-all jar once with no retry, and Central keeps
      # answering 429 for the large ones. Fetch missing jars here, Google's Central mirror first,
      # with bounded retries (curl would otherwise wait out a long Retry-After), checked against
      # the SHA-1 Central publishes, so the tests find them in ~/.m2.
      - name: Fetch missing Robolectric android-all jars
        id: robolectric-prefetch
        timeout-minutes: 20
        run: |
          set -uo pipefail
          central=https://repo1.maven.org/maven2
          mirror=https://maven-central.storage-download.googleapis.com/maven2
          dir=org/robolectric/android-all-instrumented
          get() { timeout 600 curl -fsSL --connect-timeout 20 --max-time 300 --retry 3 --retry-all-errors \
                    --retry-delay 5 --retry-max-time 120 -o "$2" "$1"; }
          for v in 6.0.1_r3-robolectric-r1-i7 8.0.0_r4-robolectric-r1-i7 9-robolectric-4913185-2-i7 \
                   11-robolectric-6757853-i7 12-robolectric-7732740-i7 13-robolectric-9030017-i7 \
                   14-robolectric-10818077-i7 15-robolectric-13954326-i7 16-robolectric-13921718-i7; do
            jar="$HOME/.m2/repository/$dir/$v/android-all-instrumented-$v.jar"
            [ -s "$jar" ] && continue
            mkdir -p "$(dirname "$jar")"
            sha1=
            for repo in "$central" "$mirror"; do
              get "$repo/$dir/$v/android-all-instrumented-$v.jar.sha1" "$jar.sha1" && sha1=$(cut -d' ' -f1 "$jar.sha1") && break
            done
            ok=
            for repo in "$mirror" "$central"; do
              get "$repo/$dir/$v/android-all-instrumented-$v.jar" "$jar.part" || continue
              if [ -n "$sha1" ] && [ "$(sha1sum "$jar.part" | cut -d' ' -f1)" = "$sha1" ]; then ok=1; break; fi
              echo "checksum mismatch from $repo for $v" >&2
            done
            rm -f "$jar.sha1"
            if [ -n "$ok" ]; then
              mv "$jar.part" "$jar"
              echo "fetched=true" >> "$GITHUB_OUTPUT"
              echo "fetched $v"
            else
              rm -f "$jar.part"
              echo "::warning::cannot fetch $v; Robolectric will try itself"
            fi
          done
      - name: Run unit test shard
        env:
          SHARD: ${{ matrix.shard }}
          # Any android-all jar the step above did not fetch comes from the mirror, not Central.
          JAVA_TOOL_OPTIONS: -Drobolectric.dependency.repo.url=https://maven-central.storage-download.googleapis.com/maven2
        run: |
          if [ "$SHARD" = modules ]; then
            ./gradlew --no-daemon --continue -PcollieHostJniDir=build/host-tests/resources \
              testDebugUnitTest :core:util-jvm:test :lib:libsignal-service:test \
              :core:network:test :lib:network:test :fast-lint:test :lintchecks:test
          else
            ./gradlew --no-daemon --continue -PcollieHostJniDir=build/host-tests/resources \
              -PcollieAppTestShard="${SHARD#app-}" :app:testProdWebsiteDebugUnitTest
          fi
      - name: Save Robolectric android-all jars
        # Save unless this shard's own cache matched: a fallback to another shard's cache lacks
        # this shard's jars, and PR caches are not visible to other branches, so main needs its own.
        if: ${{ always() && (!startsWith(steps.robolectric-cache.outputs.cache-matched-key, format('robolectric-jars-{0}-4.16-{1}-', runner.os, matrix.shard)) || steps.robolectric-prefetch.outputs.fetched == 'true' || job.status == 'failure') }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-jars-${{ runner.os }}-4.16-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Package shard results
        if: ${{ !cancelled() }}
        run: |
          find app core feature lib tooling \( -path '*/build/test-results/*/TEST-*.xml' -o -path '*/build/reports/tests/*' \) -type f -print0 > "$RUNNER_TEMP/results-list"
          printf '%s\0' build/host-tests/receipt.json build/ci/source-commit.txt build/ci/source-tree.txt >> "$RUNNER_TEMP/results-list"
          tar --null -T "$RUNNER_TEMP/results-list" -cf "$RUNNER_TEMP/results.tar"
      - name: Keep shard results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: ${{ runner.temp }}/results.tar
          if-no-files-found: error

  unit-tests:
    name: Unit tests
    if: ${{ always() && !(github.event_name == 'pull_request' && github.event.pull_request.draft) }}
    needs: [unit-test-shards]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: unit-test-shard-*-${{ github.run_id }}
          path: build/shard-artifacts
      - name: Combine and verify all unit test results
        env:
          SHARD_RESULT: ${{ needs.unit-test-shards.result }}
          CI_TEST_POLICY: >-
            ${{ ((github.event_name == 'pull_request' && github.base_ref == 'release/stable/8.35') ||
                 ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
                  github.ref == 'refs/heads/release/stable/8.35')) &&
                '.github/ci-required-tests-stable-8.35.json' || '.github/ci-required-tests.json' }}
        run: |
          for shard in app-0 app-1 modules; do
            mkdir -p "build/shards/$shard"
            tar -xf "build/shard-artifacts/unit-test-shard-$shard-${{ github.run_id }}/results.tar" -C "build/shards/$shard"
            mkdir -p "build/shards/$shard"/{app,core,feature,lib,tooling}
            (cd "build/shards/$shard" && find app core feature lib tooling -path '*/build/test-results/*/TEST-*.xml' -type f -exec cp --parents -t "$GITHUB_WORKSPACE" {} +)
          done
          mkdir -p build/ci
          mkdir -p build/host-tests
          cp build/shards/modules/build/host-tests/receipt.json build/host-tests/receipt.json
          cp "$CI_TEST_POLICY" build/ci/ci-required-tests.json
          git rev-parse HEAD > build/ci/source-commit.txt
          git rev-parse HEAD^{tree} > build/ci/source-tree.txt
          for shard in app-0 app-1 modules; do
            cmp "build/shards/$shard/build/ci/source-commit.txt" build/ci/source-commit.txt
            cmp "build/shards/$shard/build/ci/source-tree.txt" build/ci/source-tree.txt
          done
          python3 .github/scripts/check-unit-test-results.py --policy "$CI_TEST_POLICY" \
            --shard-root build/shards/app-0 --shard-root build/shards/app-1 \
            --shard-root build/shards/modules --json-output build/ci/unit-test-results.json
          test "$SHARD_RESULT" = success
          if [[ "$GITHUB_REF" == refs/heads/release/stable/8.35 ]]; then
            test "$CI_TEST_POLICY" = .github/ci-required-tests-stable-8.35.json
            jq -n \
              --arg commit "$(cat build/ci/source-commit.txt)" --arg ref "$GITHUB_REF" \
              --arg event "$GITHUB_EVENT_NAME" --argjson id "$GITHUB_RUN_ID" --argjson attempt "$GITHUB_RUN_ATTEMPT" \
              --arg policy "$CI_TEST_POLICY" --arg blob "$(git hash-object build/ci/ci-required-tests.json)" \
              '{schema: 1, source_commit: $commit, source_ref: $ref, event: $event,
                run_id: $id, run_attempt: $attempt, policy_path: $policy, policy_blob: $blob}' \
              > build/ci/stable-source-route.json
          fi
      - name: Keep the exact Stable branch route and policy for this attempt
        if: github.ref == 'refs/heads/release/stable/8.35'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stable-ci-route-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ci/stable-source-route.json
          retention-days: 14
          if-no-files-found: error
      - name: Keep combined unit test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-reports-${{ github.run_id }}
          path: |
            build/shards
            build/ci
            build/host-tests/receipt.json
            **/build/test-results/**/*.xml
            !build/shards/**/build/test-results/**
          if-no-files-found: error

  production-build:
    name: Unsigned production build
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.draft) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/disk-cleanup
      - name: Build the exact candidate with the release recipe
        run: |
          git rev-parse HEAD HEAD^{tree}
          tooling/reproducible-builds/build-release.sh "$RUNNER_TEMP/production-build"
          git rev-parse HEAD > "$RUNNER_TEMP/production-build/source-commit.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/production-build/source-tree.txt"
          sha256sum "$RUNNER_TEMP/production-build"/*.apk > "$RUNNER_TEMP/production-build/SHA256SUMS"
      - name: Retain the unsigned APK and source identity
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-build-${{ github.run_id }}
          path: ${{ runner.temp }}/production-build
          retention-days: 14
          if-no-files-found: error

  beta-compile:
    name: TrailBlazer Beta compile
    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' && !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      COLLIE_BUILD_EDITION: beta
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: ./.github/actions/disk-cleanup
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: cp tooling/gradle.properties.docker "$HOME/.gradle/gradle.properties"
      - name: Compile and assemble the Beta variant
        run: ./gradlew --no-daemon :app:assembleProdWebsiteBeta

  security-readiness:
    name: Security readiness
    if: ${{ always() && !(github.event_name == 'pull_request' && github.event.pull_request.draft) }}
    needs: [unit-tests, production-build]
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful tests and production build
        env:
          UNIT_TESTS_RESULT: ${{ needs.unit-tests.result }}
          PRODUCTION_BUILD_RESULT: ${{ needs.production-build.result }}
        run: |
          test "$UNIT_TESTS_RESULT" = success
          test "$PRODUCTION_BUILD_RESULT" = success
