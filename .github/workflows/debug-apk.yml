name: Debug APK (optional)
on:
  pull_request:
    paths-ignore:
      - docs/**
      - README.md
      - .github/codeql/**
  # Pull requests only read the Gradle cache. This run on main writes the one Debug APK needs.
  push:
    branches: [main]
    paths-ignore:
      - docs/**
      - README.md
      - .github/codeql/**
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: debug-apk-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  project-log-proof:
    if: github.event_name == 'workflow_dispatch'
    name: Project log browser proof on Android 15
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/disk-cleanup
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.14'
      - name: Test the hosted-proof result checker
        run: python3 -m unittest discover -s .github/scripts -p 'test_check_project_log_proof.py' -v
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Record selected source and build matching APKs
        id: build
        shell: bash
        run: |
          set -euo pipefail
          evidence=build/project-log-proof
          mkdir -p "$evidence"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD HEAD^{tree} > "$evidence/source.txt"
          cp tooling/gradle.properties.docker "$HOME/.gradle/gradle.properties"
          ./gradlew --no-daemon --console=plain :app:assembleProdWebsiteDebug :app:assembleProdWebsiteDebugAndroidTest \
            2>&1 | tee "$evidence/build.log"
          app_apks=(app/build/outputs/apk/prodWebsite/debug/*.apk)
          test_apks=(app/build/outputs/apk/androidTest/prodWebsite/debug/*.apk)
          test "${#app_apks[@]}" = 1 && test -f "${app_apks[0]}"
          test "${#test_apks[@]}" = 1 && test -f "${test_apks[0]}"
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print "${app_apks[0]}" > "$evidence/app-manifest.xml"
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print "${test_apks[0]}" > "$evidence/test-manifest.xml"
          sha256sum "${app_apks[0]}" "${test_apks[0]}" > "$evidence/apk-before.txt"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare connected test to reuse the hashed APK pair
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/reuse-project-log-apks.gradle" <<'GRADLE'
          def packageTasks = [':app:packageProdWebsiteDebug', ':app:packageProdWebsiteDebugAndroidTest']
          if (gradle.parent == null) {
            gradle.beforeProject { project ->
              project.tasks.configureEach { task ->
                if (packageTasks.contains(task.path)) {
                  task.onlyIf('reuse the previously built and hashed APK') { false }
                }
              }
            }
            gradle.taskGraph.whenReady { graph ->
              packageTasks.each { path ->
                if (!graph.hasTask(path)) throw new GradleException("Missing APK packaging task: $path")
              }
            }
          }
          GRADLE
          cat > "$RUNNER_TEMP/run-project-log-proof.sh" <<'SH'
          set -euo pipefail
          evidence=build/project-log-proof
          collect() {
            status=$?
            trap - EXIT
            printf '%s\n' "$status" > "$evidence/exit-code.txt"
            timeout 15s adb logcat -b all -d -t 12000 -v threadtime > "$evidence/logcat.txt" 2>&1 || true
            mkdir -p "$evidence/screenshots"
            timeout 30s adb pull /sdcard/Download/project-log-proof/. "$evidence/screenshots/" 2>&1 | tee "$evidence/pull-screenshots.log" || true
            sha256sum app/build/outputs/apk/prodWebsite/debug/*.apk \
              app/build/outputs/apk/androidTest/prodWebsite/debug/*.apk > "$evidence/apk-after.txt" || true
            exit "$status"
          }
          trap collect EXIT
          timeout 10s adb shell getprop ro.build.version.sdk | tr -d '\r' > "$evidence/device-api.txt"
          test "$(cat "$evidence/device-api.txt")" = 35
          timeout 10s adb shell getprop ro.build.fingerprint > "$evidence/device-fingerprint.txt"
          timeout 15s adb shell am force-stop com.google.android.apps.nexuslauncher
          timeout 10s adb logcat -c
          ./gradlew --no-daemon --console=plain \
            :app:packageProdWebsiteDebug :app:packageProdWebsiteDebugAndroidTest \
            :app:connectedProdWebsiteDebugAndroidTest -I "$RUNNER_TEMP/reuse-project-log-apks.gradle" \
            '-Pandroid.testInstrumentationRunnerArguments.class=org.thoughtcrime.securesms.main.setup.ProjectLogScreenshotTest' \
            2>&1 | tee "$evidence/connected.log"
          SH
      - name: Run ProjectLogScreenshotTest through Orchestrator
        id: device
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          ram-size: 3072M
          cores: 2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash "$RUNNER_TEMP/run-project-log-proof.sh"
      - name: Require API 35 screenshots and the external PR156 page
        if: always()
        env:
          EXPECTED_SHA: ${{ github.sha }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          DEVICE_OUTCOME: ${{ steps.device.outcome }}
        run: python3 .github/scripts/check-project-log-proof.py
      - name: Preserve hosted Project log proof and failure diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: project-log-proof-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/project-log-proof
            app/build/outputs/androidTest-results
            app/build/reports/androidTests
          retention-days: 14
          if-no-files-found: error
