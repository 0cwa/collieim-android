name: Verify and promote release
# Rebuilds a locally built prerelease on GitHub and promotes it to a full release when the
# rebuild matches the published collie.apk (signature files excluded). A prerelease built on
# GitHub must be verified on the maintainer's machine instead (collie-private/release/verify-local.sh).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Prerelease tag to verify and promote
        required: true
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag }}
env:
  TAG: ${{ inputs.tag }}
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Release is a prerelease built locally
        run: |
          gh release view "$TAG" --json isPrerelease,body > release.json
          jq -e '.isPrerelease' release.json >/dev/null || { echo "::error::$TAG is not a prerelease"; exit 1; }
          jq -r .body release.json | grep -q '^Built on: local\.' \
            || { echo "::error::$TAG was built on GitHub; verify it locally with verify-local.sh"; exit 1; }

  build:
    needs: check
    uses: ./.github/workflows/build-release.yml
    with:
      ref: ${{ inputs.tag }}

  compare-and-promote:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-release-apk
          path: ${{ runner.temp }}/rebuilt
      - name: Rebuild matches the published APK
        run: |
          gh release download "$TAG" --pattern collie.apk --dir "$RUNNER_TEMP"
          rebuilt=$(ls "$RUNNER_TEMP"/rebuilt/*.apk)
          python3 tooling/reproducible-builds/apkdiff/apkdiff.py "$rebuilt" "$RUNNER_TEMP/collie.apk"
      - name: Promote to full release
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh release view "$TAG" --json body -q .body \
            | sed "s|^Built on: local\. Reproducibility: not yet verified\.$|Built on: local. Reproduced on GitHub: $run_url|" > notes.md
          gh release edit "$TAG" --notes-file notes.md --prerelease=false --latest
