name: Verify and promote release
# Rebuilds a locally built Collie prerelease and promotes those exact signed bytes.
# A GitHub-built APK requires an independent rebuild on the maintainer's machine.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Prerelease tag to verify and promote
        required: true
      source_branch:
        description: Branch supplying the exact signed tag commit's CI evidence
        type: choice
        options: [main, release/stable/8.35]
        default: main
        required: true
permissions:
  contents: read
concurrency:
  group: release-im.collie.app
  cancel-in-progress: false
env:
  TAG: ${{ inputs.tag }}
  SOURCE_BRANCH: ${{ inputs.source_branch }}
  TRUSTED_MAIN: ${{ github.sha }}
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  GH_HOST: github.com
jobs:
  check:
    if: github.repository == '0cwa/collieim-android' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      source_commit: ${{ steps.identity.outputs.source_commit }}
      identity_artifact_id: ${{ steps.identity-artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Bind the signed tag, package, build origin and exact published assets
        id: identity
        run: |
          mkdir -p "$RUNNER_TEMP/promotion-evidence"
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          python3 tooling/release/publication.py inspect --tag "$TAG" --purpose promote \
            --scratch "$RUNNER_TEMP/release-assets" --build-tools "$bt" \
            --output "$RUNNER_TEMP/promotion-evidence/before.json" --github-output "$GITHUB_OUTPUT"
      - name: Exact source commit still passes the release CI gate
        env:
          SOURCE_COMMIT: ${{ steps.identity.outputs.source_commit }}
        run: |
          python3 tooling/ci/verify_release_readiness.py --repository "$GH_REPO" --sha "$SOURCE_COMMIT" \
            --source-branch "$SOURCE_BRANCH" --trusted-main "$TRUSTED_MAIN" \
            --report "$RUNNER_TEMP/promotion-evidence/ci.json"
      - id: identity-artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: promotion-identity-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/promotion-evidence/*.json
          retention-days: 30
          if-no-files-found: error

  build:
    needs: check
    uses: ./.github/workflows/build-release.yml
    with:
      ref: ${{ needs.check.outputs.source_commit }}

  compare-and-promote:
    needs: [check, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-release-apk
          path: ${{ runner.temp }}/rebuilt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.check.outputs.identity_artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/promotion-evidence
      - name: Recheck exact-source CI after the independent rebuild
        env:
          SOURCE_COMMIT: ${{ needs.check.outputs.source_commit }}
        run: |
          python3 tooling/ci/verify_release_readiness.py --repository "$GH_REPO" --sha "$SOURCE_COMMIT" \
            --source-branch "$SOURCE_BRANCH" --trusted-main "$TRUSTED_MAIN" \
            --report "$RUNNER_TEMP/promotion-evidence/final-ci.json"
          cmp "$RUNNER_TEMP/promotion-evidence/ci.json" "$RUNNER_TEMP/promotion-evidence/final-ci.json"
      - name: Reverify unchanged identity, compare the rebuild and promote to Latest
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          python3 tooling/release/publication.py promote \
            --identity "$RUNNER_TEMP/promotion-evidence/before.json" --rebuilt-directory "$RUNNER_TEMP/rebuilt" \
            --run-url "$run_url" --scratch "$RUNNER_TEMP/release-assets" --build-tools "$bt" \
            --output "$RUNNER_TEMP/promotion-evidence/promoted.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: promotion-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/promotion-evidence/*.json
          retention-days: 30
          if-no-files-found: error
