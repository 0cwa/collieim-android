name: Encrypted push JVM fuzzing

on:
  pull_request:
    paths:
      - ".github/workflows/encrypted-push-fuzz.yml"
      - "app/src/main/java/im/molly/unifiedpush/enrollment/ControlKeyId.kt"
      - "app/src/main/java/im/molly/unifiedpush/enrollment/EnrollmentFile.kt"
      - "app/src/main/java/im/molly/unifiedpush/control/ControlFrame.kt"
      - "app/src/main/java/im/molly/unifiedpush/receiver/EncryptedPush.kt"
      - "app/src/test/resources/colliesocket-contract-v3/fixtures/**"
      - "tooling/fuzz-encrypted-push/**"
      - "gradle/libs.versions.toml"
      - "settings.gradle.kts"
      - "gradle/verification-metadata.xml"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: encrypted-push-fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04
      options: --memory=4g --memory-swap=4g --cpus=2
    timeout-minutes: 15
    steps:
      - name: Install tools required by pinned actions
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends ca-certificates curl git tar unzip zstd
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Replay deterministic tests and saved findings
        run: ./gradlew :fuzz-encrypted-push:test --no-daemon --no-configuration-cache --max-workers=1 -Dorg.gradle.jvmargs=-Xmx1g

  discovery:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04
      options: --memory=4g --memory-swap=4g --cpus=2
    timeout-minutes: 10
    steps:
      - name: Install tools required by pinned actions
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends ca-certificates curl git python3 tar unzip zstd
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Restore the separate rolling discovery corpus
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: tooling/fuzz-encrypted-push/.cifuzz-corpus
          key: encrypted-push-corpus-${{ github.run_id }}
          restore-keys: encrypted-push-corpus-
      - name: Record source and tool reproduction metadata
        run: |
          mkdir -p tooling/fuzz-encrypted-push/build/fuzz-evidence
          {
            echo "commit=${GITHUB_SHA}"
            echo "contract_pin=9751c1effba7c94f49474febd941ca7fe3ba31cc"
            echo "jazzer=0.30.0"
            echo "jdk=21"
            echo "command=./gradlew :fuzz-encrypted-push:jazzerFuzz --no-daemon --no-configuration-cache --max-workers=1 -Dorg.gradle.jvmargs=-Xmx1g"
            echo "fuzz_duration_per_target=60s"
            echo "input_byte_limit=4096"
            echo "job_memory_limit=4g"
            echo "job_cpu_limit=2"
          } > tooling/fuzz-encrypted-push/build/fuzz-evidence/run-metadata.txt
      - name: Run bounded discovery
        run: ./gradlew :fuzz-encrypted-push:jazzerFuzz --no-daemon --no-configuration-cache --max-workers=1 -Dorg.gradle.jvmargs=-Xmx1g
      - name: Bound the separate rolling discovery cache
        if: always()
        run: python3 tooling/fuzz-encrypted-push/cap_corpus.py tooling/fuzz-encrypted-push/.cifuzz-corpus
      - name: Preserve crash bytes, generated corpus, and run metadata
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: encrypted-push-jazzer-${{ github.run_id }}
          path: |
            tooling/fuzz-encrypted-push/src/test/resources/**/*Inputs/**
            tooling/fuzz-encrypted-push/crash-*
            tooling/fuzz-encrypted-push/.cifuzz-corpus/**
            tooling/fuzz-encrypted-push/build/reports/tests/**
            tooling/fuzz-encrypted-push/build/fuzz-evidence/**
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
