name: Candidate Java and Kotlin CodeQL
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Independently approved full source commit
        type: string
        required: true
      source_tree:
        description: Independently approved full source tree
        type: string
        required: true
permissions:
  contents: read
jobs:
  analyze:
    if: github.repository == '0cwa/collieim-android' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/_codeql-android.yml
    with:
      source_commit: ${{ inputs.source_commit }}
      config_commit: ${{ github.sha }}
      candidate: true
      source_tree: ${{ inputs.source_tree }}
