# Current path ownership for feature_diff.py. This map describes the net tree
# delta, including changes inherited from Signal since the Molly baseline.
# Patterns are relative to the repo root. *, ?, and [] match within a path
# component. A ** component matches zero or more levels.
#
# Shared paths override a single exclusive claim and count once overall.
# Each feature lists the shared files relevant to its --include-shared patch.
# Leave uncertain ownership unmapped. Dependencies document relationships only.

[shared]
paths = [
  "**/strings2.xml",
  "app/src/main/res/values*/strings*.xml",
  "feature/app-settings/src/main/res/values*/strings*.xml",
  "tooling/layers.toml",
  "gradle/libs.versions.toml",
  "gradle.properties",
  "app/build.gradle.kts",
  "app/src/main/AndroidManifest.xml",
  "app/src/main/java/org/thoughtcrime/securesms/ApplicationContext.java",
  "app/src/main/java/org/thoughtcrime/securesms/flags/CollieFlags.kt",
  "app/src/main/protowire/JobData.proto",
]

