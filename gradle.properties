# To prevent non-deterministic R8 issues, we set some flags.
# The determinstic debugging one is self-explanatory, but also not as far-reaching as you'd hope.
# The hashcode one uses a more determinstic hashcode (an incrementing counter).
# Paired with the threadPoolSize=1 below, this should give us what we need.
org.gradle.jvmargs=-Xmx4g -Xms256m -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dcom.android.tools.r8.deterministicdebugging=true -XX:+UnlockExperimentalVMOptions -XX:hashCode=3
android.r8.threadPoolSize=1

# Give the Kotlin compile daemon its own heap limit.
kotlin.daemon.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true
org.gradle.tooling.parallel=true
org.gradle.caching=true

android.useAndroidX=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=fail

# We never want to use auto-provisioning, as it breaks reproducible builds.
# This should not be a problem, because we never configure a "javaRepositories"
# item to tell Gradle where to auto-provision the toolchain from, but adding
# this flag adds an extra layer of protection.
# See: https://docs.gradle.org/current/userguide/toolchains.html#sub:disable_auto_provision
org.gradle.java.installations.auto-download=false

# Required: Kotlin source files exist under src/testFixtures (e.g. core/ui).
android.experimental.enableTestFixturesKotlinSupport=true
# Required: app/build.gradle.kts uses kotlinExt.sourceSets.create(...) to wire Kotlin
# source sets for Wire 5.x, which AGP 9.0's built-in Kotlin doesn't create automatically.
android.disallowKotlinSourceSets=false


# CI runners share Maven Central addresses and Central answers bursts with HTTP 429. Gradle retries
# 3 times (1 s, 2 s apart), then disables the repository for the whole build, and a plugin lookup
# reports every failure as "Plugin ... was not found". Retry 7 times, 2 s doubling (about 2 minutes),
# so a throttled build waits instead of failing. This changes no resolved input; dependency
# verification still checks every artifact.
systemProp.org.gradle.internal.repository.max.tentatives=7
systemProp.org.gradle.internal.repository.initial.backoff=2000

# Canonical Collie identity: no legacy product matrix.
mollyFirebaseFree=false
baseAppTitle=Collie
baseAppFileName=Collie
basePackageId=im.collie.app
# Brand that `./gradlew updateTranslationsAll` writes into mollyify-marked translations.
mollyify.brand=Collie

