name: Published workflow CodeQL
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
cache-mode: read
jobs:
  workflow-analysis:
    name: Analyze GitHub Actions only
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    env:
      CODEQL_ACTION_DIFF_INFORMED_QUERIES: 'false'
      CODEQL_ACTION_FILE_COVERAGE_ON_PRS: 'true'
      CODEQL_OVERLAY_DATABASE_MODE: 'none'
    steps:
      - name: Check out exact source under analysis
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          lfs: false
      - name: Check out trusted review policy at the base revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted-policy
          sparse-checkout: .github/codeql
          persist-credentials: false
          lfs: false
      - name: Require trusted base CodeQL configuration
        run: |
          test -f trusted-policy/.github/codeql/codeql-config.yml
          test -s trusted-policy/.github/codeql/codeql-config.yml
      - name: Load the independently reviewed engineering policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 0cwa/collie-release-engineering
          ref: 20d46e0c2d072a06c6088233cd8e4badbdb6f475
          path: policy
          sparse-checkout: tools/codeql
          persist-credentials: false
      - name: State the exact analyzed source and coverage limit
        run: |
          git rev-parse HEAD HEAD^{tree}
          printf '%s\n' 'Actions workflow analysis only. See the separate Java/Kotlin job for application coverage; native dependency source analysis is not run.' >> "$GITHUB_STEP_SUMMARY"
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          tools: linked
          languages: actions
          source-root: .
          config-file: ./trusted-policy/.github/codeql/codeql-config.yml
          trap-caching: false
          dependency-caching: false
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:actions
          checkout_path: ${{ github.workspace }}
          output: ${{ runner.temp }}/codeql-sarif
          upload: ${{ vars.CODEQL_ADVANCED_UPLOAD == 'true' && 'always' || 'never' }}
          upload-database: false
      - name: Apply the pinned findings and extraction gate
        if: always() && !cancelled()
        run: |
          mkdir -p "$RUNNER_TEMP/codeql-evidence"
          review_file=trusted-policy/.github/codeql/reviewed-findings.json
          if [[ ! -f "$review_file" ]]; then
            review_file="$RUNNER_TEMP/codeql-evidence/empty-reviews.json"
            printf '%s\n' '{"schema":1,"reviews":[]}' > "$review_file"
          fi
          python3 policy/tools/codeql/report.py "$RUNNER_TEMP/codeql-sarif" \
            --language actions --reviews "$review_file" \
            --source-root . --output "$RUNNER_TEMP/codeql-evidence/audit.json" \
            --summary "$RUNNER_TEMP/codeql-evidence/audit.md"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always() && !cancelled()
        with:
          name: codeql-published-workflows
          path: |
            ${{ runner.temp }}/codeql-sarif
            ${{ runner.temp }}/codeql-evidence
          if-no-files-found: error
          retention-days: 14
  application-analysis:
    name: Analyze Java and Kotlin application
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    env:
      CODEQL_ACTION_DIFF_INFORMED_QUERIES: 'false'
      CODEQL_ACTION_FILE_COVERAGE_ON_PRS: 'true'
      CODEQL_OVERLAY_DATABASE_MODE: 'none'
    steps:
      - name: Check out exact source under analysis
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          lfs: false
      - name: Check out trusted review policy at the base revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted-policy
          sparse-checkout: .github/codeql
          persist-credentials: false
          lfs: false
      - name: Load reviewed engineering gate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 0cwa/collie-release-engineering
          ref: 20d46e0c2d072a06c6088233cd8e4badbdb6f475
          path: policy
          sparse-checkout: tools/codeql
          persist-credentials: false
      - name: Record source and verify pinned native input policy
        run: |
          mkdir -p "$RUNNER_TEMP/codeql-evidence"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/codeql-evidence/source.txt"
          printf '%s\n' 'The app compilation consumes verified native artifacts; native dependency source is not analyzed.' >> "$GITHUB_STEP_SUMMARY"
          test -s trusted-policy/.github/codeql/codeql-config.yml
          sha256sum -c <<'CHECKSUMS'
          557e20c3f8c1d6290af3007bb8eba5469e5a77f569b8efc7dc2edc1e68ba7856  build-inputs/native-lock.json
          b88197b390284a7f340f1b2a786167592961ff8f57857a8bf72ac7747f704a26  build-inputs/native-publication.json
          2342cfddbfc3a150c204dee2a1738d924b9f4d69f621e2cebd77dc6e5f61c568  gradle/verification-metadata.xml
          CHECKSUMS
      - uses: ./.github/actions/disk-cleanup
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: cp tooling/gradle.properties.docker "$HOME/.gradle/gradle.properties"
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        id: codeql-init
        with:
          tools: linked
          languages: java-kotlin
          build-mode: manual
          source-root: .
          config-file: ./trusted-policy/.github/codeql/codeql-config.yml
          trap-caching: false
          dependency-caching: false
      - name: Compile the debug application under CodeQL tracing
        env:
          CODEQL_COMPILE_INPUTS: ${{ runner.temp }}/codeql-evidence/compiler-inputs.jsonl
        run: |
          ./gradlew --no-daemon --no-build-cache --rerun-tasks --dependency-verification strict \
            -Pkotlin.incremental=false -Pkotlin.compiler.execution.strategy=in-process \
            -I policy/tools/codeql/compile-inputs.gradle :app:assembleProdWebsiteDebug
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:java-kotlin
          checkout_path: ${{ github.workspace }}
          output: ${{ runner.temp }}/codeql-java-sarif
          upload: ${{ vars.CODEQL_ADVANCED_UPLOAD == 'true' && 'always' || 'never' }}
          upload-database: false
      - name: Record successfully extracted compiler inputs
        env:
          CODEQL_PATH: ${{ steps.codeql-init.outputs.codeql-path }}
        run: |
          "$CODEQL_PATH" version > "$RUNNER_TEMP/codeql-evidence/codeql-version.txt"
          "$CODEQL_PATH" resolve qlpacks --format=json > "$RUNNER_TEMP/codeql-evidence/qlpacks.json"
          pack=$(jq -er '."codeql/java-queries" | if type == "array" and length == 1 then .[0] else error("ambiguous Java query pack") end' "$RUNNER_TEMP/codeql-evidence/qlpacks.json")
          cp policy/tools/codeql/compiled-files.ql "$pack/collie-compiled-files.ql"
          "$CODEQL_PATH" query run --database="$RUNNER_TEMP/codeql_databases/java" \
            --output="$RUNNER_TEMP/codeql-evidence/compiled-files.bqrs" "$pack/collie-compiled-files.ql"
          "$CODEQL_PATH" bqrs decode --format=csv --no-titles \
            --output="$RUNNER_TEMP/codeql-evidence/extracted.csv" "$RUNNER_TEMP/codeql-evidence/compiled-files.bqrs"
      - name: Apply findings and extraction gate
        if: always() && !cancelled()
        run: |
          mkdir -p "$RUNNER_TEMP/codeql-evidence"
          review_file=trusted-policy/.github/codeql/reviewed-findings.json
          if [[ ! -f "$review_file" ]]; then
            review_file="$RUNNER_TEMP/codeql-evidence/empty-reviews.json"
            printf '%s\n' '{"schema":1,"reviews":[]}' > "$review_file"
          fi
          python3 policy/tools/codeql/report.py "$RUNNER_TEMP/codeql-java-sarif" \
            --language java-kotlin --reviews "$review_file" --source-root . \
            --compiler-inputs "$RUNNER_TEMP/codeql-evidence/compiler-inputs.jsonl" --extracted-inputs "$RUNNER_TEMP/codeql-evidence/extracted.csv" \
            --output "$RUNNER_TEMP/codeql-evidence/audit.json" --summary "$RUNNER_TEMP/codeql-evidence/audit.md"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always() && !cancelled()
        with:
          name: codeql-java-kotlin
          path: |
            ${{ runner.temp }}/codeql-java-sarif
            ${{ runner.temp }}/codeql-evidence
            ${{ runner.temp }}/codeql_databases/java/log
          if-no-files-found: error
          retention-days: 14
