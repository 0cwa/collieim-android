name: Website
on:
  push:
    branches: [main]
    paths:
      - docs/site/**
      - tooling/site/**
      - .github/workflows/site.yml
  pull_request:
    paths:
      - docs/site/**
      - tooling/site/**
      - .github/workflows/site.yml
  # Daily rebuild so the "Latest release" line follows new releases. Release tags
  # do not carry this workflow, so a release event cannot trigger it.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions: {}
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    name: Build collie.im
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the page with the latest release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tooling/site/build.py --out _site
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
