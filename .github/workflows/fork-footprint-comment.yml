name: Fork footprint comment
on:
  workflow_run:
    workflows: [Fork footprint (advisory)]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: fork-footprint-validation-${{ github.event.workflow_run.head_repository.id || github.event.workflow_run.repository_id }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false
jobs:
  validate:
    if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      should_comment: ${{ steps.validate.outputs.should_comment }}
      repository: ${{ steps.validate.outputs.repository }}
      pr_number: ${{ steps.validate.outputs.pr_number }}
      base_sha: ${{ steps.validate.outputs.base_sha }}
      head_sha: ${{ steps.validate.outputs.head_sha }}
      report_b64: ${{ steps.validate.outputs.report_b64 }}
    steps:
      - name: Check out trusted default branch code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download metadata from the triggering run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: pr-meta
          path: pr-meta
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate metadata, fetch commit objects, and generate bounded report
        id: validate
        env:
          EVENT_PATH: ${{ github.event_path }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 tooling/ci/fork_footprint.py validate-run --event "$EVENT_PATH" --meta pr-meta/pr-meta.json
  comment:
    needs: validate
    if: ${{ needs.validate.outputs.should_comment == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: fork-footprint-comment-pr-${{ needs.validate.outputs.pr_number }}
      cancel-in-progress: false
    steps:
      - name: Check out trusted default branch code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
      - name: Validate and post bounded report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          REPORTED_REPOSITORY: ${{ needs.validate.outputs.repository }}
          PR_NUMBER: ${{ needs.validate.outputs.pr_number }}
          EXPECTED_PR_NUMBER: ${{ needs.validate.outputs.pr_number }}
          BASE_SHA: ${{ needs.validate.outputs.base_sha }}
          HEAD_SHA: ${{ needs.validate.outputs.head_sha }}
          REPORT_B64: ${{ needs.validate.outputs.report_b64 }}
        run: python3 tooling/ci/fork_footprint.py post-report --repository "$REPORTED_REPOSITORY" --pr "$PR_NUMBER" --base "$BASE_SHA" --head "$HEAD_SHA" --report-b64 "$REPORT_B64"
