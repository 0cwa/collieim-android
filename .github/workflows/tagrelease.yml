name: Collie release automation setup

on:
  workflow_dispatch:

permissions: {}

jobs:
  release_setup_incomplete:
    name: Hosted release setup is incomplete
    runs-on: ubuntu-24.04
    steps:
      - name: Explain current release status
        shell: bash
        run: |
          echo "Hosted Collie release signing and publishing are not configured yet." >&2
          echo "This workflow cannot create a tag or publish a release." >&2
          exit 1
