name: Publish prerelease
# Run after `collie-private/release/release.sh` has pushed a signed tag and uploaded the
# signed collie.apk to a draft release. Checks the tag signature, APK certificate, version
# and release notes, uploads the profile copies, and publishes the draft as a prerelease.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v8.35.1-4-rc1
        required: true
      built_on:
        description: Where the release APK was built
        type: choice
        options: [local, github]
        required: true
permissions:
  contents: write
concurrency:
  group: release-${{ inputs.tag }}
env:
  TAG: ${{ inputs.tag }}
  BUILT_ON: ${{ inputs.built_on }}
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  APK_CERT_SHA256: f8cc0c0c052e5635c26fcd293c2b0af3e87d61ff7f2df3602a9af6e91f73c826
  PACKAGE_ID: im.collie.app
  PROFILE_COPIES: collie-foss molly-continued molly-foss-continued molly-minimal
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out trusted signer list from the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Tag is signed by the release key
        run: |
          [[ "$TAG" =~ ^v[0-9A-Za-z.+-]+$ ]] || { echo "::error::bad tag name $TAG"; exit 1; }
          git fetch --depth=1 origin "refs/tags/$TAG:refs/tags/$TAG"
          [ "$(git cat-file -t "$TAG")" = tag ] || { echo "::error::$TAG is not an annotated tag"; exit 1; }
          cp .github/release-signers "$RUNNER_TEMP/release-signers"
          git -c gpg.ssh.allowedSignersFile="$RUNNER_TEMP/release-signers" verify-tag "$TAG"
      - name: Tag source declares this version
        id: version
        run: |
          props=$(git show "$TAG^{commit}:gradle.properties")
          name=$(sed -n 's/^releaseVersionName=//p' <<<"$props")
          code=$(sed -n 's/^releaseVersionCode=//p' <<<"$props")
          [ "v$name" = "$TAG" ] || { echo "::error::gradle.properties releaseVersionName=$name does not match $TAG"; exit 1; }
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Tag source has the store changelog for this version
        env:
          CODE: ${{ steps.version.outputs.code }}
        run: |
          git cat-file -e "$TAG^{commit}:fastlane/metadata/android/en-US/changelogs/$CODE.txt" \
            || { echo "::error::add fastlane/metadata/android/en-US/changelogs/$CODE.txt before tagging"; exit 1; }
      - name: Release notes exist in the release-engineering repo
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          curl -fsSL "https://raw.githubusercontent.com/0cwa/collie-release-engineering/main/distribution/release-notes/$VERSION.md" \
            -o "$RUNNER_TEMP/notes.md" \
            || { echo "::error::add distribution/release-notes/$VERSION.md to collie-release-engineering main"; exit 1; }
      - name: Uploaded APK is signed, versioned and named correctly
        env:
          NAME: ${{ steps.version.outputs.name }}
          CODE: ${{ steps.version.outputs.code }}
        run: |
          cd "$RUNNER_TEMP"
          gh release download "$TAG" --pattern collie.apk
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$bt/apksigner" verify --print-certs collie.apk | tee certs.txt
          # Output format differs between build-tools versions, so compare the distinct digests.
          digests=$(grep -o 'certificate SHA-256 digest: [0-9a-f]\{64\}' certs.txt | awk '{print $NF}' | sort -u)
          [ "$digests" = "$APK_CERT_SHA256" ] \
            || { echo "::error::collie.apk is not signed only with the Collie release certificate (found: $digests)"; exit 1; }
          "$bt/aapt2" dump badging collie.apk | head -1 | tee badging.txt
          grep -q "package: name='$PACKAGE_ID' versionCode='$CODE' versionName='$NAME'" badging.txt \
            || { echo "::error::APK identity does not match $PACKAGE_ID $CODE $NAME"; exit 1; }
      - name: Upload profile copies
        run: |
          cd "$RUNNER_TEMP"
          for name in $PROFILE_COPIES; do cp collie.apk "$name.apk"; done
          gh release upload "$TAG" --clobber $(printf '%s.apk ' $PROFILE_COPIES)
      - name: Publish as prerelease
        run: |
          cd "$RUNNER_TEMP"
          printf '\n\n---\nBuilt on: %s. Reproducibility: not yet verified.\n' "$BUILT_ON" >> notes.md
          gh release edit "$TAG" --notes-file notes.md --prerelease --draft=false
